        const cleanUser = username.trim().toLowerCase();
        const cleanPass = password.trim();
        const found = users.find(
          (u) =>
            (u.username.toLowerCase() === cleanUser ||
              u.name.toLowerCase() === cleanUser ||
              u.email.toLowerCase() === cleanUser) &&
            u.password === cleanPass
        );

          onLogin(found);
        } else {
          setError('Usuário ou senha inválidos. Verifique os dados informados.');
        }

    }) {

      const [newSectionTitle, setNewSectionTitle] = useState('');
      const [feedback, setFeedback] = useState(null);

      const formRef = useRef(null);

      useEffect(() => {
        if (sections.length > 0 && !sections.some((s) => s.id === targetSectionId)) {
          setTargetSectionId(sections[0].id);
        }
      }, [sections]);

      const notify = (msg) => {
        setFeedback(msg);
        setTimeout(() => setFeedback(null), 3500);
      };

      const resetQuestionForm = () => {
        setPromptText('');
        setPlaceholderText('');
        setIsRequired(true);
        setEditingQuestionId(null);
        setShowAddQuestion(false);
      };

      const scrollToForm = () => {
        setTimeout(() => {
          formRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 50);
      };

      const handleEditClick = (q) => {
        setTargetSectionId(q.sectionId);
        setPromptText(q.prompt);
        setPlaceholderText(q.placeholder || '');
        setIsRequired(q.required);
        setEditingQuestionId(q.id);
        setShowAddQuestion(true);
        setShowAddSection(false);
        scrollToForm();
      };

      const handleSaveQuestion = async (e) => {
        e.preventDefault();
        if (!promptText.trim()) return;

        if (editingQuestionId) {
          const existing = questions.find((q) => q.id === editingQuestionId);
          if (existing) {
            await onUpdate
