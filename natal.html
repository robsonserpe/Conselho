            </div>

            <div id="printable-report-sheet" className="p-6 sm:p-8 bg-white text-stone-900 space-y-5">
              <div className="print-avoid-break border-2 border-stone-800 rounded-xl p-5 text-center">
                <h1 className="text-base font-extrabold uppercase font-serif">{report.schoolName}</h1>
                <p className="text-xs font-semibold uppercase text-stone-600">{report.schoolSubtitle}</p>
                <div className="my-2 mx-auto w-32 h-0.5 bg-stone-800" />
                <h2 className="text-sm font-black uppercase tracking-widest">{report.title}</h2>

                <div className="mt-4 pt-4 border-t border-stone-300 grid grid-cols-2 gap-3 text-left text-xs">
                  <div><strong>Componente:</strong> {report.component}</div>
                  <div><strong>Evento / Data:</strong> {eventDisplay} ({report.date})</div>
                  <div><strong>Professor(a):</strong> {report.teacherName}</div>
                  <div><strong>Turma:</strong> {report.classGroup}</div>
                </div>
              </div>

              {report.dimensionRatings && Object.keys(report.dimensionRatings).length > 0 && (
                <div className="print-avoid-break border border-stone-300 rounded-xl p-4">
                  <h3 className="text-xs font-bold uppercase font-serif border-b border-stone-200 pb-2 mb-3">
                    Avaliação Conceitual da Turma
                  </h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                    {EVALUATION_DIMENSIONS.map((d) => {
                      const val = report.dimensionRatings[d.id];
                      if (!val) return null;
                      return (
                        <div key={d.id} className="flex justify-between p-2 bg-stone-50 rounded border border-stone-200">
                          <span className="font-semibold">{d.name}</span>
                          <span className="uppercase font-bold text-red-900">{val}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {sortedSections.map((sec) => {
                const secQs = questions.filter((q) => q.sectionId === sec.id).sort((a, b) => a.order - b.order);
                if (secQs.length === 0) return null;
                return (
                  <div key={sec.id} className="border border-stone-300 rounded-xl p-4 space-y-3">
                    <h3 className="text-xs font-bold uppercase font-serif border-b border-stone-200 pb-2">
                      {sec.title}
                    </h3>
                    {secQs.map((q, idx) => (
                      <div key={q.id} className="print-avoid-break text-xs">
                        <p className="font-bold text-stone-900 mb-1">{idx + 1}. {q.prompt}</p>
                        <div className="p-3 bg-stone-50 border border-stone-200 rounded-lg whitespace-pre-wrap">
                          {report.answers?.[q.id] || <span className="italic text-stone-400">Sem registro.</span>}
                        </div>
                      </div>
                    ))}
                  </div>
                );
              })}

              {(goodStudents.length > 0 || badStudents.length > 0 || transferredStudents.length > 0) && (
                <div className="border border-stone-300 rounded-xl p-4 space-y-4">
                  <h3 className="text-xs font-bold uppercase font-serif border-b border-stone-200 pb-2">
                    Avaliação Conceitual Individual dos Estudantes — Quadro Comparativo ({report.classGroup})
                  </h3>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 items-start">
                    <div className="border-2 border-emerald-300 bg-emerald-50/60 rounded-xl overflow-hidden">
                      <div className="bg-emerald-700 text-white px-3.5 py-2 flex items-center justify-between">
                        <span className="text-xs font-extrabold uppercase tracking-wide">
                          Desempenho Satisfatório (Bom / Ótimo)
                        </span>
                        <span className="bg-white/20 text-white text-[11px] font-bold px-2 py-0.5 rounded-full">
                          {goodStudents.length}
                        </span>
                      </div>

                      {goodStudents.length === 0 ? (
                        <div className="p-4 text-xs text-emerald-800/70 italic text-center">
                          Nenhum estudante classificado nesta coluna.
                        </div>
                      ) : (
                        <div className="divide-y divide-emerald-200/80">
                          {goodStudents.map(({ student, rating, notes }) => (
                            <div key={student.id} className="print-avoid-break p-3 bg-emerald-50/40 text-xs">
                              <div className="flex items-center justify-between gap-2">
                                <span className="font-bold text-emerald-950">
                                  {student.rollNumber ? `${student.rollNumber}. ` : ''}{student.name}
                                </span>
                                <span className="px-2 py-0.5 rounded-md bg-emerald-600 text-white text-[10px] font-extrabold shrink-0">
                                  {formatConceptLabel(rating)}
                                </span>
                              </div>
                              {notes && (
                                <p className="text-[11px] text-emerald-900 mt-1 bg-white/70 px-2 py-1 rounded border border-emerald-200">
                                  <strong>Obs:</strong> {notes}
                                </p>
                              )}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    <div className="border-2 border-rose-300 bg-rose-50/60 rounded-xl overflow-hidden">
                      <div className="bg-rose-700 text-white px-3.5 py-2 flex items-center justify-between">
                        <span className="text-xs font-extrabold uppercase tracking-wide">
                          Atenção / Dificuldade (Ruim / Regular)
                        </span>
                        <span className="bg-white/20 text-white text-[11px] font-bold px-2 py-0.5 rounded-full">
                          {badStudents.length}
                        </span>
                      </div>

                      {badStudents.length === 0 ? (
                        <div className="p-4 text-xs text-rose-800/70 italic text-center">
                          Nenhum estudante classificado nesta coluna.
                        </div>
                      ) : (
                        <div className="divide-y divide-rose-200/80">
                          {badStudents.map(({ student, rating, notes }) => (
                            <div key={student.id} className="print-avoid-break p-3 bg-rose-50/40 text-xs">
                              <div className="flex items-center justify-between gap-2">
                                <span className="font-bold text-rose-950">
                                  {student.rollNumber ? `${student.rollNumber}. ` : ''}{student.name}
                                </span>
                                <span className="px-2 py-0.5 rounded-md bg-rose-600 text-white text-[10px] font-extrabold shrink-0">
                                  {formatConceptLabel(rating)}
                                </span>
                              </div>
                              {notes && (
                                <p className="text-[11px] text-rose-900 mt-1 bg-white/70 px-2 py-1 rounded border border-rose-200">
                                  <strong>Obs:</strong> {notes}
                                </p>
                              )}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>

                  {transferredStudents.length > 0 && (
                    <div className="print-avoid-break p-2.5 bg-stone-100 border border-stone-200 rounded-lg text-[11px] text-stone-600">
                      <strong>Estudantes Transferidos (sem avaliação conceitual):</strong>{' '}
                      {transferredStudents.map((s) => `${s.rollNumber ? s.rollNumber + '. ' : ''}${s.name}`).join(', ')}.
                    </div>
                  )}
                </div>
              )}

              <div className="print-avoid-break pt-8 border-t border-stone-300 grid grid-cols-3 gap-6 text-center text-xs">
                <div>
                  <div className="border-b border-stone-500 pb-1 font-bold">{report.teacherName}</div>
                  <p className="text-[11px] text-stone-600 mt-1">Professor(a)</p>
                </div>
                <div>
                  <div className="border-b border-stone-500 pb-1 font-bold">
                    {report.pedagogaSignature?.signed ? 'Coordenação Pedagógica' : '______________________'}
                  </div>
                  <p className="text-[11px] text-stone-600 mt-1">Equipe Pedagógica</p>
                </div>
                <div>
                  <div className="border-b border-stone-500 pb-1 font-bold">
                    {report.diretoraSignature?.signed ? 'Direção Escolar (Homologado)' : '______________________'}
                  </div>
                  <p className="text-[11px] text-stone-600 mt-1">Diretora</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 11. PAINEL GRÁFICO CONSOLIDADO POR TURMA E EVENTO LETIVO
    // =========================================================================
    function ClassChartsDashboard({ classes, teachers = [], students = [], reports }) {
      const availableClasses = collectAllClassNames(classes, teachers, reports, students);

      const availableEvents = Array.from(
        new Set([
          `${CURRENT_YEAR} • 1º Trimestre`,
          `${CURRENT_YEAR} • 2º Trimestre`,
          `${CURRENT_YEAR} • 3º Trimestre`,
          ...reports.map((r) => normalizeEventLabel(r.trimester)),
        ])
      ).sort((a, b) => b.localeCompare(a, 'pt-BR'));

      const [selectedClass, setSelectedClass] = useState(availableClasses[0] || '6º Ano A');
      const [selectedEvent, setSelectedEvent] = useState(availableEvents[0] || `${CURRENT_YEAR} • 1º Trimestre`);

      useEffect(() => {
        if (availableClasses.length > 0 && !availableClasses.some((c) => sameClassGroup(c, selectedClass))) {
          setSelectedClass(availableClasses[0]);
        }
      }, [classes, teachers, reports, students]);

      useEffect(() => {
        if (availableEvents.length > 0 && !availableEvents.includes(selectedEvent)) {
          setSelectedEvent(availableEvents[0]);
        }
      }, [reports]);

      const classReports = reports.filter(
        (r) =>
          sameClassGroup(r.classGroup, selectedClass) &&
          normalizeEventLabel(r.trimester) === selectedEvent &&
          r.dimensionRatings &&
          Object.keys(r.dimensionRatings).length > 0
      );

      const calcPct = (count, total) => (total > 0 ? Math.round((count / total) * 100) : 0);

      const dimensionStats = EVALUATION_DIMENSIONS.map((dim) => {
        const counts = { otimo: 0, bom: 0, regular: 0, ruim: 0 };
        classReports.forEach((rep) => {
          const val = rep.dimensionRatings?.[dim.id];
          if (val && Object.prototype.hasOwnProperty.call(counts, val)) {
            counts[val] += 1;
          }
        });
        const total = counts.otimo + counts.bom + counts.regular + counts.ruim;
        return {
          ...dim,
          counts,
          total,
          pct: {
            otimo: calcPct(counts.otimo, total),
            bom: calcPct(counts.bom, total),
            regular: calcPct(counts.regular, total),
            ruim: calcPct(counts.ruim, total),
          },
        };
      });

      const overallCounts = dimensionStats.reduce(
        (acc, d) => ({
          otimo: acc.otimo + d.counts.otimo,
          bom: acc.bom + d.counts.bom,
          regular: acc.regular + d.counts.regular,
          ruim: acc.ruim + d.counts.ruim,
        }),
        { otimo: 0, bom: 0, regular: 0, ruim: 0 }
      );
      const overallTotal = overallCounts.otimo + overallCounts.bom + overallCounts.regular + overallCounts.ruim;
      const overallPct = {
        otimo: calcPct(overallCounts.otimo, overallTotal),
        bom: calcPct(overallCounts.bom, overallTotal),
        regular: calcPct(overallCounts.regular, overallTotal),
        ruim: calcPct(overallCounts.ruim, overallTotal),
      };

      const labelConcept = (v) => {
        if (v === 'otimo') return { text: 'Ótimo', badge: 'bg-emerald-100 text-emerald-800 border-emerald-300' };
        if (v === 'bom') return { text: 'Bom', badge: 'bg-blue-100 text-blue-800 border-blue-300' };
        if (v === 'regular') return { text: 'Regular', badge: 'bg-amber-100 text-amber-800 border-amber-300' };
        if (v === 'ruim') return { text: 'Ruim', badge: 'bg-rose-100 text-rose-800 border-rose-300' };
        return { text: '-', badge: 'bg-stone-100 text-stone-500 border-stone-200' };
      };

      return (
        <div className="max-w-5xl mx-auto px-4 py-6 space-y-6">
          <div className="no-print bg-white p-5 rounded-2xl border border-stone-200 shadow-xs flex flex-col sm:flex-row sm:items-end justify-between gap-4">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 flex-1">
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">
                  Selecione a Turma (Visão Geral Consolidada)
                </label>
                <select
                  value={selectedClass}
                  onChange={(e) => setSelectedClass(e.target.value)}
                  className="w-full bg-stone-50 border border-stone-300 rounded-xl px-3.5 py-2 text-xs font-bold text-stone-900"
                >
                  {availableClasses.map((clsName) => (
                    <option key={clsName} value={clsName}>{clsName}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">
                  Ano Letivo / Evento de Referência
                </label>
                <select
                  value={selectedEvent}
                  onChange={(e) => setSelectedEvent(e.target.value)}
                  className="w-full bg-red-50 border border-red-300 rounded-xl px-3.5 py-2 text-xs font-extrabold text-red-950"
                >
                  {availableEvents.map((ev) => (
                    <option key={ev} value={ev}>{ev}</option>
                  ))}
                </select>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2 shrink-0">
              <button
                type="button"
                onClick={() => window.print()}
                className="flex items-center justify-center gap-1.5 px-4 py-2.5 bg-stone-800 hover:bg-stone-700 text-white text-xs font-bold rounded-xl cursor-pointer"
              >
                <Icon name="printer" className="w-4 h-4 text-amber-400" />
                <span>Imprimir</span>
              </button>
              <button
                type="button"
                onClick={() => {
                  const el = document.getElementById('printable-chart-sheet');
                  if (!el || !window.html2pdf) { window.print(); return; }
                  const clean = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9_-]+/g, '_');
                  window.html2pdf().set({
                    margin: [10, 10, 12, 10],
                    filename: `Grafico_Consolidado_${clean(selectedEvent)}_${clean(selectedClass)}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, scrollY: 0 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
                  }).from(el).save();
                }}
                className="flex items-center justify-center gap-1.5 px-4 py-2.5 bg-red-700 hover:bg-red-800 text-white text-xs font-bold rounded-xl cursor-pointer"
              >
                <Icon name="download" className="w-4 h-4" />
                <span>Baixar PDF</span>
              </button>
            </div>
          </div>

          <div id="printable-chart-sheet" className="space-y-6">
            <div className="bg-white p-6 rounded-2xl border border-stone-200 shadow-xs">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-stone-200 pb-4">
                <div>
                  <span className="text-[11px] font-bold uppercase tracking-wider text-red-800">
                    {SCHOOL_NAME}
                  </span>
                  <h2 className="text-lg sm:text-xl font-extrabold text-stone-900 font-serif mt-0.5">
                    Gráfico Consolidado da Turma: {selectedClass} — {selectedEvent}
                  </h2>
                  <p className="text-xs text-stone-500 mt-1">
                    Síntese percentual dos <strong>6 critérios pedagógicos da turma</strong> somando todas as fichas preenchidas pelos professores ({classReports.length}{' '}
                    {classReports.length === 1 ? 'ficha lançada' : 'fichas lançadas'}).
                  </p>
                </div>
              </div>

              <div className="mt-4">
                <p className="text-[11px] font-bold uppercase text-stone-500 mb-1.5">
                  Professores e Disciplinas incluídos neste gráfico:
                </p>
                {classReports.length === 0 ? (
                  <p className="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-xl p-3">
                    Nenhuma ficha com avaliação conceitual da turma foi preenchida ainda para <strong>{selectedClass}</strong> no evento <strong>{selectedEvent}</strong>.
                  </p>
                ) : (
                  <div className="flex flex-wrap gap-1.5">
                    {classReports.map((r) => (
                      <span
                        key={r.id}
                        className="px-2.5 py-1 rounded-lg bg-stone-100 border border-stone-200 text-xs font-semibold text-stone-800"
                      >
                        {r.teacherName} ({r.component})
                      </span>
                    ))}
                  </div>
                )}
              </div>

              {overallTotal > 0 && (
                <div className="mt-6 grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div className="p-4 rounded-2xl bg-emerald-50 border border-emerald-200">
                    <p className="text-[11px] font-bold uppercase text-emerald-800">Ótimo (Geral)</p>
                    <p className="text-2xl font-black text-emerald-900 mt-1">{overallPct.otimo}%</p>
                    <p className="text-[11px] text-emerald-700 mt-0.5">{overallCounts.otimo} de {overallTotal} avaliações</p>
                  </div>
                  <div className="p-4 rounded-2xl bg-blue-50 border border-blue-200">
                    <p className="text-[11px] font-bold uppercase text-blue-800">Bom (Geral)</p>
                    <p className="text-2xl font-black text-blue-900 mt-1">{overallPct.bom}%</p>
                    <p className="text-[11px] text-blue-700 mt-0.5">{overallCounts.bom} de {overallTotal} avaliações</p>
                  </div>
                  <div className="p-4 rounded-2xl bg-amber-50 border border-amber-200">
                    <p className="text-[11px] font-bold uppercase text-amber-800">Regular (Geral)</p>
                    <p className="text-2xl font-black text-amber-900 mt-1">{overallPct.regular}%</p>
                    <p className="text-[11px] text-amber-700 mt-0.5">{overallCounts.regular} de {overallTotal} avaliações</p>
                  </div>
                  <div className="p-4 rounded-2xl bg-rose-50 border border-rose-200">
                    <p className="text-[11px] font-bold uppercase text-rose-800">Ruim (Geral)</p>
                    <p className="text-2xl font-black text-rose-900 mt-1">{overallPct.ruim}%</p>
                    <p className="text-[11px] text-rose-700 mt-0.5">{overallCounts.ruim} de {overallTotal} avaliações</p>
                  </div>
                </div>
              )}
            </div>

            {overallTotal > 0 && (
              <div className="bg-white p-6 rounded-2xl border border-stone-200 shadow-xs space-y-5">
                <div className="flex flex-wrap items-center justify-between gap-2 border-b border-stone-200 pb-3">
                  <h3 className="text-sm font-extrabold uppercase font-serif text-stone-900">
                    Percentual por Critério Pedagógico da Turma (6 Dimensões)
                  </h3>
                  <div className="flex flex-wrap items-center gap-3 text-[11px] font-bold">
                    <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-xs bg-emerald-600 inline-block" /> Ótimo</span>
                    <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-xs bg-blue-600 inline-block" /> Bom</span>
                    <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-xs bg-amber-500 inline-block" /> Regular</span>
                    <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-xs bg-rose-600 inline-block" /> Ruim</span>
                  </div>
                </div>

                <div className="space-y-4">
                  {dimensionStats.map((dim, idx) => (
                    <div key={dim.id} className="p-4 rounded-xl bg-stone-50 border border-stone-200 space-y-2.5">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-1">
                        <div>
                          <p className="text-xs sm:text-sm font-bold text-stone-900">
                            {idx + 1}. {dim.name}
                          </p>
                          <p className="text-[11px] text-stone-500">{dim.description}</p>
                        </div>
                        <div className="flex flex-wrap items-center gap-1.5 text-[11px] font-extrabold shrink-0">
                          <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-900">Ótimo: {dim.pct.otimo}% ({dim.counts.otimo})</span>
                          <span className="px-2 py-0.5 rounded bg-blue-100 text-blue-900">Bom: {dim.pct.bom}% ({dim.counts.bom})</span>
                          <span className="px-2 py-0.5 rounded bg-amber-100 text-amber-900">Regular: {dim.pct.regular}% ({dim.counts.regular})</span>
                          <span className="px-2 py-0.5 rounded bg-rose-100 text-rose-900">Ruim: {dim.pct.ruim}% ({dim.counts.ruim})</span>
                        </div>
                      </div>

                      <div className="w-full h-7 bg-stone-200 rounded-lg overflow-hidden flex text-[11px] font-extrabold text-white shadow-inner">
                        {dim.pct.otimo > 0 && (
                          <div
                            style={{ width: `${dim.pct.otimo}%` }}
                            className="bg-emerald-600 flex items-center justify-center transition-all"
                            title={`Ótimo: ${dim.pct.otimo}%`}
                          >
                            {dim.pct.otimo >= 8 ? `${dim.pct.otimo}%` : ''}
                          </div>
                        )}
                        {dim.pct.bom > 0 && (
                          <div
                            style={{ width: `${dim.pct.bom}%` }}
                            className="bg-blue-600 flex items-center justify-center transition-all"
                            title={`Bom: ${dim.pct.bom}%`}
                          >
                            {dim.pct.bom >= 8 ? `${dim.pct.bom}%` : ''}
                          </div>
                        )}
                        {dim.pct.regular > 0 && (
                          <div
                            style={{ width: `${dim.pct.regular}%` }}
                            className="bg-amber-500 flex items-center justify-center transition-all"
                            title={`Regular: ${dim.pct.regular}%`}
                          >
                            {dim.pct.regular >= 8 ? `${dim.pct.regular}%` : ''}
                          </div>
                        )}
                        {dim.pct.ruim > 0 && (
                          <div
                            style={{ width: `${dim.pct.ruim}%` }}
                            className="bg-rose-600 flex items-center justify-center transition-all"
                            title={`Ruim: ${dim.pct.ruim}%`}
                          >
                            {dim.pct.ruim >= 8 ? `${dim.pct.ruim}%` : ''}
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {classReports.length > 0 && (
              <div className="bg-white p-6 rounded-2xl border border-stone-200 shadow-xs overflow-x-auto">
                <h3 className="text-sm font-extrabold uppercase font-serif text-stone-900 mb-3">
                  Detalhamento por Professor e Disciplina ({selectedClass} — {selectedEvent})
                </h3>
                <table className="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr className="bg-stone-100 border-b border-stone-300 text-[11px] uppercase text-stone-700">
                      <th className="p-2.5">Professor(a) / Disciplina</th>
                      {EVALUATION_DIMENSIONS.map((d, i) => (
                        <th key={d.id} className="p-2.5 text-center" title={d.name}>
                          {i + 1}. {d.name.split(' ')[0]}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-stone-200">
                    {classReports.map((rep) => (
                      <tr key={rep.id} className="hover:bg-stone-50">
                        <td className="p-2.5">
                          <p className="font-bold text-stone-900">{rep.teacherName}</p>
                          <p className="text-[11px] text-stone-500">{rep.component}</p>
                        </td>
                        {EVALUATION_DIMENSIONS.map((d) => {
                          const info = labelConcept(rep.dimensionRatings?.[d.id]);
                          return (
                            <td key={d.id} className="p-2.5 text-center">
                              <span className={`px-2 py-0.5 rounded-md border text-[11px] font-bold ${info.badge}`}>
                                {info.text}
                              </span>
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 12. CADASTRO E IMPORTAÇÃO EXCEL DE PROFESSORES, MATÉRIAS, TURMAS E ALUNOS
    // =========================================================================
    function SchoolEntitiesManager({
      tab,
      teachers,
      classes,
      students,
      subjects,
      onAddSubject,
      onDeleteSubject,
      onAddTeacher,
      onUpdateTeacher,
      onUpsertMultipleTeachers,
      onDeleteTeacher,
      onAddClass,
      onDeleteClass,
      onAddStudent,
      onUpdateStudent,
      onAddMultipleStudents,
      onDeleteStudent,
      onDeleteStudentsByClass,
    }) {
      const allConsolidatedClasses = collectAllClassNames(classes, teachers, [], students);

      const [name, setName] = useState('');
      const [extra1, setExtra1] = useState(subjects[0] || '');
      const [extra2, setExtra2] = useState(allConsolidatedClasses[0] || '6º Ano A');
      const [classYear, setClassYear] = useState(CURRENT_YEAR);
      const [teacherPassword, setTeacherPassword] = useState('123');
      const [selectedSubjects, setSelectedSubjects] = useState(subjects[0] ? [subjects[0]] : []);
      const [selectedClasses, setSelectedClasses] = useState([allConsolidatedClasses[0] || '6º Ano A']);
      const [studentNotes, setStudentNotes] = useState('');
      const [studentStatusSelect, setStudentStatusSelect] = useState('ativo');
      const [studentClassFilter, setStudentClassFilter] = useState('all');
      const [editingTeacherId, setEditingTeacherId] = useState(null);
      const [editingStudentId, setEditingStudentId] = useState(null);
      const [classStudentsToClear, setClassStudentsToClear] = useState(null);
      const [feedback, setFeedback] = useState(null);

      const formRef = useRef(null);

      useEffect(() => {
        setEditingTeacherId(null);
        setEditingStudentId(null);
        setName('');
        setTeacherPassword('123');
        setClassYear(CURRENT_YEAR);
        setExtra1(tab === 'teachers' ? (subjects[0] || '') : '');
        const defaultCls = allConsolidatedClasses[0] || '6º Ano A';
        setExtra2(tab === 'classes' ? 'Matutino' : defaultCls);
        setStudentNotes('');
        setStudentStatusSelect('ativo');
        setStudentClassFilter('all');
        setSelectedSubjects(subjects[0] ? [subjects[0]] : []);
        setSelectedClasses(defaultCls ? [defaultCls] : []);
      }, [tab]);

      const notify = (msg) => {
        setFeedback(msg);
        setTimeout(() => setFeedback(null), 5000);
      };

      const startEditTeacher = (teacher) => {
        setEditingTeacherId(teacher.id);
        setName(teacher.name);
        const list = extractTeacherSubjects(teacher, subjects);
        setSelectedSubjects(list);
        setTeacherPassword(teacher.password || '123');
        setSelectedClasses(extractTeacherClasses(teacher));
        setTimeout(() => {
          formRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 50);
      };

      const cancelEditTeacher = () => {
        setEditingTeacherId(null);
        setName('');
        setSelectedSubjects(subjects[0] ? [subjects[0]] : []);
        setTeacherPassword('123');
        setSelectedClasses(allConsolidatedClasses[0] ? [allConsolidatedClasses[0]] : []);
      };

      const startEditStudent = (student) => {
        setEditingStudentId(student.id);
        setName(student.name);
        setExtra1(student.rollNumber || '');
        setExtra2(student.classGroup || allConsolidatedClasses[0] || '6º Ano A');
        const transferred = isStudentTransferred(student);
        setStudentStatusSelect(transferred ? 'transferido' : 'ativo');
        setStudentNotes(student.notes || '');
        setTimeout(() => {
          formRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 50);
      };

      const cancelEditStudent = () => {
        setEditingStudentId(null);
        setName('');
        setExtra1('');
        setStudentNotes('');
        setStudentStatusSelect('ativo');
      };

      const handleQuickToggleTransferred = async (student) => {
        const currentlyTransferred = isStudentTransferred(student);
        const nextTransferred = !currentlyTransferred;
        const cleanedNotes = String(student.notes || '')
          .replace(/transferido/gi, '')
          .replace(/\s{2,}/g, ' ')
          .trim();

        const updated = {
          ...student,
          status: nextTransferred ? 'transferido' : 'ativo',
          notes: nextTransferred
            ? (cleanedNotes ? `${cleanedNotes} • Transferido` : 'Transferido')
            : cleanedNotes,
        };
        await onUpdateStudent(updated);
        notify(
          nextTransferred
            ? `${student.name} marcado(a) como TRANSFERIDO(A).`
            : `${student.name} reativado(a) como ATIVO(A).`
        );
      };

      const handleCreateOrUpdate = async (e) => {
        e.preventDefault();
        if (!name.trim()) return;

        if (tab === 'subjects') {
          const cleanSubj = name.trim();
          if (subjects.some((s) => sameText(s, cleanSubj))) {
            notify(`A matéria "${cleanSubj}" já está cadastrada!`);
            return;
          }
          await onAddSubject(cleanSubj);
          notify(`Matéria "${cleanSubj}" cadastrada com sucesso!`);
          setName('');
        } else if (tab === 'teachers') {
          const finalSubjects = selectedSubjects.length > 0 ? selectedSubjects : [subjects[0] || 'Componente Curricular'];
          const subjectSummary = finalSubjects.join(', ');

          if (editingTeacherId) {
            const existing = teachers.find((t) => t.id === editingTeacherId);
            if (existing) {
              await onUpdateTeacher({
                ...existing,
                name: name.trim(),
                username: name.trim(),
                subject: subjectSummary,
                subjects: finalSubjects,
                password: teacherPassword.trim() || '123',
                classes: selectedClasses,
              });
              notify(`Dados de ${name.trim()} atualizados (${finalSubjects.length} matéria(s), senha e turmas salvas)!`);
            }
            cancelEditTeacher();
          } else {
            await onAddTeacher({
              id: `prof-${Date.now()}`,
              name: name.trim(),
              username: name.trim(),
              email: `${name.trim().toLowerCase().replace(/\s+/g, '.')}@escola.gov.br`,
              password: teacherPassword.trim() || '123',
              role: 'professor',
              subject: subjectSummary,
              subjects: finalSubjects,
              classes: selectedClasses,
            });
            notify(`Professor(a) ${name.trim()} cadastrado(a) com ${finalSubjects.length} matéria(s)!`);
            setName('');
            setTeacherPassword('123');
          }
        } else if (tab === 'classes') {
          await onAddClass({
            id: `cls-${Date.now()}`,
            name: name.trim(),
            grade: extra1 || name.trim(),
            shift: extra2 || 'Matutino',
            year: Number(classYear) || CURRENT_YEAR,
            room: '',
          });
          notify(`Turma "${name.trim()}" (${classYear}) cadastrada!`);
          setName('');
        } else if (tab === 'students') {
          const cleanNotes = studentNotes.trim();
          const targetCls = (extra2 || allConsolidatedClasses[0] || '6º Ano A').trim();
          const isTransferred =
            studentStatusSelect === 'transferido' || cleanNotes.toLowerCase().includes('transfer');
          const finalNotes = isTransferred
            ? (cleanNotes.toLowerCase().includes('transfer')
                ? cleanNotes
                : cleanNotes
                ? `${cleanNotes} • Transferido`
                : 'Transferido')
            : cleanNotes;

          if (editingStudentId) {
            const existing = students.find((s) => s.id === editingStudentId);
            if (existing) {
              await onUpdateStudent({
                ...existing,
                name: name.trim(),
                rollNumber: extra1 ? extra1.trim().padStart(2, '0') : '',
                classGroup: targetCls,
                status: isTransferred ? 'transferido' : 'ativo',
                notes: finalNotes,
              });
              notify(`Cadastro de "${name.trim()}" atualizado com sucesso!`);
            }
            cancelEditStudent();
          } else {
            await onAddStudent({
              id: `std-${Date.now()}`,
              name: name.trim(),
              rollNumber: extra1 ? extra1.trim().padStart(2, '0') : '',
              classGroup: targetCls,
              status: isTransferred ? 'transferido' : 'ativo',
              notes: finalNotes,
            });
            setStudentClassFilter(targetCls);
            notify(`Estudante "${name.trim()}" cadastrado(a) na turma ${targetCls}!`);
            setName('');
            setExtra1('');
            setStudentNotes('');
            setStudentStatusSelect('ativo');
          }
        }
      };

      const handleDownloadTeacherTemplate = () => {
        if (!window.XLSX) {
          notify('Biblioteca Excel ainda carregando, aguarde um instante.');
          return;
        }
        const sampleData = [
          ['Nome', 'Senha', 'Matérias', 'Turmas'],
          ['Luis Fernando', '123', 'Língua Inglesa, Projeto de Vida', '6º Ano A, 7º Ano A, 8º Ano A, 9º Ano A'],
          ['Robson Serpe', '123', 'Matemática, Física', '8º Ano A, 9º Ano A'],
          ['Maria Clara Mendes', '123', 'Língua Portuguesa, Arte', '6º Ano A, 7º Ano A'],
        ];
        const ws = window.XLSX.utils.aoa_to_sheet(sampleData);
        ws['!cols'] = [{ wch: 28 }, { wch: 12 }, { wch: 36 }, { wch: 38 }];
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, 'Professores');
        window.XLSX.writeFile(wb, 'Modelo_Importacao_Professores.xlsx');
      };

      const handleTeacherExcelImport = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (!window.XLSX) {
          notify('Erro: biblioteca de leitura Excel não carregada. Verifique a internet.');
          return;
        }
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const wb = window.XLSX.read(data, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

            let startIdx = 0;
            if (rows.length > 0) {
              const firstRowText = rows[0].map((c) => String(c || '').trim().toLowerCase()).join(' ');
              if (
                firstRowText.includes('nome') ||
                firstRowText.includes('professor') ||
                firstRowText.includes('materia') ||
                firstRowText.includes('matéria') ||
                firstRowText.includes('turma')
              ) {
                startIdx = 1;
              }
            }

            const groupedMap = new Map();

            for (let i = startIdx; i < rows.length; i++) {
              const row = rows[i] || [];
              const rawName = String(row[0] ?? '').trim();
              if (!rawName) continue;

              const rawPass = String(row[1] ?? '').trim() || '123';
              const rawSubjectsCol = String(row[2] ?? '').trim();
              const rawClassesCol = String(row[3] ?? '').trim();

              const key = rawName.toLowerCase();
              if (!groupedMap.has(key)) {
                groupedMap.set(key, {
                  name: rawName,
                  password: rawPass,
                  subjects: [],
                  classes: [],
                });
              }
              const entry = groupedMap.get(key);
              if (rawPass && rawPass !== '123') entry.password = rawPass;

              const extractItems = (text) =>
                text
                  .split(/[,;|]+/)
                  .map((item) => item.trim())
                  .filter(Boolean);

              extractItems(rawSubjectsCol).forEach((item) => {
                if (item.includes(':')) {
                  const [clsPart, subjPart] = item.split(':').map((p) => p.trim());
                  if (clsPart && !entry.classes.some((x) => sameClassGroup(x, clsPart))) {
                    entry.classes.push(clsPart);
                  }
                  if (subjPart && !entry.subjects.some((x) => sameText(x, subjPart))) {
                    entry.subjects.push(subjPart);
                  }
                } else if (!entry.subjects.some((x) => sameText(x, item))) {
                  entry.subjects.push(item);
                }
              });

              extractItems(rawClassesCol).forEach((item) => {
                if (item.includes(':')) {
                  const [clsPart, subjPart] = item.split(':').map((p) => p.trim());
                  if (clsPart && !entry.classes.some((x) => sameClassGroup(x, clsPart))) {
                    entry.classes.push(clsPart);
                  }
                  if (subjPart && !entry.subjects.some((x) => sameText(x, subjPart))) {
                    entry.subjects.push(subjPart);
                  }
                } else if (!entry.classes.some((x) => sameClassGroup(x, item))) {
                  entry.classes.push(item);
                }
              });
            }

            const parsedList = Array.from(groupedMap.values());
            if (parsedList.length === 0) {
              notify('Nenhum professor válido encontrado na planilha. Colunas esperadas: Nome | Senha | Matérias | Turmas.');
              return;
            }

            const result = await onUpsertMultipleTeachers(parsedList);
            notify(
              `Importação concluída! ${result.createdCount} professor(es) novo(s) cadastrado(s) e ${result.updatedCount} atualizado(s).`
            );
          } catch (err) {
            console.error('Erro ao ler planilha de professores:', err);
            notify('Não foi possível ler o arquivo. Salve como .xlsx ou .csv e tente novamente.');
          } finally {
            e.target.value = '';
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const handleDownloadTemplate = () => {
        if (!window.XLSX) {
          notify('Biblioteca Excel ainda carregando, aguarde um instante.');
          return;
        }
        const sampleData = [
          ['Número', 'Nome', 'Observação'],
          ['01', 'Ana Clara Oliveira', ''],
          ['02', 'Bruno Henrique Santos', ''],
          ['03', 'Camila Ferreira Lima', 'Transferido'],
        ];
        const ws = window.XLSX.utils.aoa_to_sheet(sampleData);
        ws['!cols'] = [{ wch: 10 }, { wch: 36 }, { wch: 28 }];
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, 'Alunos');
        window.XLSX.writeFile(wb, 'Modelo_Importacao_Alunos.xlsx');
      };

      const handleExcelImport = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (!window.XLSX) {
          notify('Erro: biblioteca de leitura Excel não carregada. Verifique a internet.');
          return;
        }
        const targetClass = (extra2 || allConsolidatedClasses[0] || '6º Ano A').trim();
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const wb = window.XLSX.read(data, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

            const list = [];
            let startIdx = 0;

            if (rows.length > 0) {
              const firstRowText = rows[0].map((c) => String(c || '').trim().toLowerCase()).join(' ');
              if (
                firstRowText.includes('nome') ||
                firstRowText.includes('numero') ||
                firstRowText.includes('número') ||
                firstRowText.includes('nº')
              ) {
                startIdx = 1;
              }
            }

            for (let i = startIdx; i < rows.length; i++) {
              const row = rows[i] || [];
              const col0 = String(row[0] ?? '').trim();
              const col1 = String(row[1] ?? '').trim();
              const col2 = String(row[2] ?? '').trim();

              let rollNumber = '';
              let studentName = '';
              let notes = '';

              if (col1 && (/^\d+$/.test(col0) || col0 === '')) {
                rollNumber = col0 ? col0.padStart(2, '0') : String(list.length + 1).padStart(2, '0');
                studentName = col1;
                notes = col2;
              } else if (col0 && !/^\d+$/.test(col0)) {
                rollNumber = String(list.length + 1).padStart(2, '0');
                studentName = col0;
                notes = col1;
              }

              if (studentName) {
                const isTransferred = notes.toLowerCase().includes('transfer');
                list.push({
                  id: `std-${Date.now()}-${i}-${Math.random().toString(36).slice(2, 5)}`,
                  name: studentName,
                  rollNumber,
                  classGroup: targetClass,
                  status: isTransferred ? 'transferido' : 'ativo',
                  notes,
                });
              }
            }

            if (list.length > 0) {
              await onAddMultipleStudents(list);
              setStudentClassFilter(targetClass);
              notify(`${list.length} aluno(s) importado(s) especificamente para a turma ${targetClass}!`);
            } else {
              notify('Nenhum aluno válido encontrado na planilha. Verifique as colunas: Número | Nome | Observação.');
            }
          } catch (err) {
            console.error('Erro ao ler planilha Excel:', err);
            notify('Não foi possível ler o arquivo. Salve como .xlsx ou .csv e tente novamente.');
          } finally {
            e.target.value = '';
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const visibleStudents = students
        .filter((s) => studentClassFilter === 'all' || sameClassGroup(s.classGroup, studentClassFilter))
        .sort((a, b) => (a.classGroup || '').localeCompare(b.classGroup || '') || (a.rollNumber || '').localeCompare(b.rollNumber || ''));

      const isEditingAny = Boolean(editingTeacherId || editingStudentId);

      const allTeacherFormSubjects = Array.from(new Set([...subjects, ...selectedSubjects]));
      const allTeacherFormClasses = Array.from(
        new Set([...allConsolidatedClasses, ...selectedClasses])
      ).sort((a, b) => a.localeCompare(b, 'pt-BR'));

      return (
        <div className="max-w-5xl mx-auto px-4 py-6 space-y-6">
          {feedback && (
            <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3 rounded-xl text-xs flex items-center gap-2 shadow-xs">
              <Icon name="check" className="w-4 h-4 text-emerald-600 shrink-0" />
              <span className="font-medium">{feedback}</span>
            </div>
          )}

          <div
            ref={formRef}
            className={`bg-white p-6 rounded-2xl border shadow-xs transition-all ${
              isEditingAny ? 'border-2 border-red-400 shadow-md' : 'border-stone-200'
            }`}
          >
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-lg font-bold text-stone-900">
                {tab === 'subjects'
                  ? 'Cadastro de Matérias / Componentes Curriculares'
                  : tab === 'teachers'
                  ? editingTeacherId
                    ? 'Editar Professor (Matérias, Senha e Turmas)'
                    : 'Cadastro e Importação de Professores (Individual ou Excel)'
                  : tab === 'classes'
                  ? 'Cadastro de Turmas'
                  : editingStudentId
                  ? 'Editar Cadastro do Estudante (Situação / Transferência / Turma)'
                  : 'Cadastro e Importação de Alunos por Turma'}
              </h2>
              {editingTeacherId && (
                <button
                  type="button"
                  onClick={cancelEditTeacher}
                  className="text-xs font-semibold text-stone-500 hover:text-stone-800 px-3 py-1 bg-stone-100 rounded-lg cursor-pointer"
                >
                  Cancelar Edição
                </button>
              )}
              {editingStudentId && (
                <button
                  type="button"
                  onClick={cancelEditStudent}
                  className="text-xs font-semibold text-stone-500 hover:text-stone-800 px-3 py-1 bg-stone-100 rounded-lg cursor-pointer"
                >
                  Cancelar Edição
                </button>
              )}
            </div>

            <form
              onSubmit={handleCreateOrUpdate}
              className={`grid grid-cols-1 ${tab === 'classes' ? 'sm:grid-cols-4' : 'sm:grid-cols-3'} gap-3 items-end`}
            >
              <div className={tab === 'subjects' ? 'sm:col-span-2' : ''}>
                <label className="block text-xs font-bold text-stone-700 mb-1">
                  {tab === 'subjects'
                    ? 'Nome da Matéria / Disciplina (Ex: Educação Financeira, Robótica) *'
                    : tab === 'teachers'
                    ? 'Nome do Professor *'
                    : tab === 'classes'
                    ? 'Nome da Turma (Ex: 6º Ano B) *'
                    : 'Nome do Estudante *'}
                </label>
                <input
                  required
                  placeholder={tab === 'subjects' ? 'Digite o nome da nova matéria...' : ''}
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  className="w-full bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-xs focus:bg-white focus:ring-2 focus:ring-red-500 outline-none"
                />
              </div>

              {tab === 'teachers' && (
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">Senha de Acesso *</label>
                  <input
                    type="text"
                    required
                    value={teacherPassword}
                    onChange={(e) => setTeacherPassword(e.target.value)}
                    placeholder="Ex: 123 ou nova senha"
                    className="w-full bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-xs font-semibold focus:bg-white focus:ring-2 focus:ring-red-500 outline-none"
                  />
                </div>
              )}

              {tab === 'classes' && (
                <>
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">Turno</label>
                    <select
                      value={extra2}
                      onChange={(e) => setExtra2(e.target.value)}
                      className="w-full bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-xs"
                    >
                      <option value="Matutino">Matutino</option>
                      <option value="Vespertino">Vespertino</option>
                      <option value="Noturno">Noturno</option>
                      <option value="Integral">Integral</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">Ano Letivo</label>
                    <select
                      value={classYear}
                      onChange={(e) => setClassYear(Number(e.target.value))}
                      className="w-full bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-xs font-bold"
                    >
                      {SCHOOL_YEARS.map((yr) => (
                        <option key={yr} value={yr}>{yr}</option>
                      ))}
                    </select>
                  </div>
                </>
              )}

              {tab === 'students' && (
                <>
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">Número (Chamada)</label>
                    <input
                      type="text"
                      placeholder="Ex: 01"
                      value={extra1}
                      onChange={(e) => setExtra1(e.target.value)}
                      className="w-full bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-xs"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">Turma *</label>
                    <select
                      value={extra2}
                      onChange={(e) => {
                        setExtra2(e.target.value);
                        if (!editingStudentId) {
                          setStudentClassFilter(e.target.value);
                        }
                      }}
                      className="w-full bg-red-50 border border-red-400 rounded-xl px-3 py-2 text-xs font-bold text-red-950"
                    >
                      {allConsolidatedClasses.map((clsName) => (
                        <option key={clsName} value={clsName}>{clsName}</option>
                      ))}
                    </select>
                  </div>
                </>
              )}

              <button
                type="submit"
                className="px-4 py-2 bg-red-700 hover:bg-red-800 text-white text-xs font-bold rounded-xl cursor-pointer"
              >
                {(tab === 'teachers' && editingTeacherId) || (tab === 'students' && editingStudentId)
                  ? 'Salvar Alterações'
                  : '+ Cadastrar'}
              </button>
            </form>

            {tab === 'teachers' && (

function TeacherAccountSettings({ user, users, onSave, onClose }) {
  const [name, setName] = useState(user.name || '');
  const [username, setUsername] = useState(user.username || user.name || '');
  const [currentPassword, setCurrentPassword] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [error, setError] = useState('');
  const [saving, setSaving] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');

    const cleanName = name.trim();
    const cleanUsername = username.trim();

    if (!cleanName || !cleanUsername) {
      setError('Informe o nome e o usuário.');
      return;
    }

    if (currentPassword !== user.password) {
      setError('A senha atual está incorreta.');
      return;
    }

    if (newPassword && newPassword.length < 6) {
      setError('A nova senha deve ter pelo menos 6 caracteres.');
      return;
    }

    if (newPassword !== confirmPassword) {
      setError('A confirmação da senha não confere.');
      return;
    }

    const loginTaken = users.some((u) =>
      u.id !== user.id &&
      (
        String(u.username || '').toLowerCase() === cleanUsername.toLowerCase() ||
        String(u.name || '').toLowerCase() === cleanUsername.toLowerCase()
      )
    );

    if (loginTaken) {
      setError('Esse usuário já está sendo utilizado.');
      return;
    }

    setSaving(true);

    try {
      await onSave({
        ...user,
        name: cleanName,
        username: cleanUsername,
        password: newPassword || user.password,
      });

      onClose();
    } catch (err) {
      setError(err.message || 'Erro ao salvar os dados.');
    } finally {
      setSaving(false);
    }
  };

  return (
    <div className="fixed inset-0 z-50 bg-stone-900/60 flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">

        <h2 className="text-lg font-extrabold text-stone-900 mb-1">
          Minha conta
        </h2>

        <p className="text-xs text-stone-500 mb-5">
          Altere seu nome e seus dados de acesso.
        </p>

        {error && (
          <div className="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-xs text-red-700">
            {error}
          </div>
        )}

        <form onSubmit={handleSubmit} className="space-y-4">

          <div>
            <label className="block text-xs font-bold mb-1">
              Nome do professor
            </label>
            <input
              value={name}
              onChange={(e) => setName(e.target.value)}
              required
              className="w-full border rounded-xl px-3 py-2.5 text-sm"
            />
          </div>

          <div>
            <label className="block text-xs font-bold mb-1">
              Usuário para entrar no sistema
            </label>
            <input
              value={username}
              onChange={(e) => setUsername(e.target.value)}
              required
              className="w-full border rounded-xl px-3 py-2.5 text-sm"
            />
          </div>

          <div className="border-t pt-4">
            <h3 className="text-sm font-bold mb-2">
              Alterar senha
            </h3>

            <p className="text-[11px] text-stone-500 mb-3">
              Informe a senha atual para confirmar sua identidade.
              Se não quiser trocar a senha, deixe os campos de nova
              senha vazios.
            </p>

            <label className="block text-xs font-bold mb-1">
              Senha atual
            </label>
            <input
              type="password"
              value={currentPassword}
              onChange={(e) => setCurrentPassword(e.target.value)}
              required
              className="w-full border rounded-xl px-3 py-2.5 text-sm"
            />
          </div>

          <div>
            <label className="block text-xs font-bold mb-1">
              Nova senha
            </label>
            <input
              type="password"
              value={newPassword}
              onChange={(e) => setNewPassword(e.target.value)}
              placeholder="Mínimo de 6 caracteres"
              className="w-full border rounded-xl px-3 py-2.5 text-sm"
            />
          </div>

          <div>
            <label className="block text-xs font-bold mb-1">
              Confirmar nova senha
            </label>
            <input
              type="password"
              value={confirmPassword}
              onChange={(e) => setConfirmPassword(e.target.value)}
              className="w-full border rounded-xl px-3 py-2.5 text-sm"
            />
          </div>

          <div className="flex justify-end gap-2 pt-3">
            <button
              type="button"
              onClick={onClose}
              className="px-4 py-2.5 rounded-xl bg-stone-100 text-stone-700 text-xs font-bold"
            >
              Cancelar
            </button>

            <button
              type="submit"
              disabled={saving}
              className="px-4 py-2.5 rounded-xl bg-amber-700 text-white text-xs font-bold disabled:opacity-60"
            >
              {saving ? 'Salvando...' : 'Salvar alterações'}
            </button>
          </div>

        </form>
      </div>
    </div>
  );
}

          return saved ? JSON.parse(saved) : SEED_SUBJECTS;
        } catch {
          return SEED_SUBJECTS;
        }

      const [viewingReport, setViewingReport] = useState(null);

      const reportDbError = (error, actionLabel) => {
        if (!error) return;
        console.error(`Erro Supabase (${actionLabel}):`, error);
        setDbError(`Erro ao sincronizar (${actionLabel}): ${error.message}`);
        setTimeout(() => setDbError(null), 6000);
      };

      useEffect(() => {
        async function loadData() {
          if (!supabase) {
            setLoading(false);
            return;
          }
          try {
            const [uRes, subjRes, cRes, sRes, secRes, qRes, rRes] = await Promise.all([
              supabase.from('users').select('*'),
              supabase.from('school_subjects').select('*').order('name'),
              supabase.from('school_classes').select('*'),
              supabase.from('students').select('*'),
              supabase.from('question_sections').select('*').order('order'),
              supabase.from('questions').select('*').order('order'),
              supabase.from('pre_council_reports').select('*').order('created_at', { ascending: false }),
            ]);

            if (uRes.data?.length) {
              const normalizedUsers = uRes.data.map((u) => {
                const parsedSubjs = extractTeacherSubjects(u, []);
                const parsedClasses = extractTeacherClasses(u);
                return {
                  ...u,
                  subjects: parsedSubjs,
                  subject: parsedSubjs.join(', ') || u.subject || '',
                  classes: parsedClasses,
                };
              });
              setUsers(normalizedUsers);

        let createdCount = 0;
        let updatedCount = 0;

        const nextUsers = [...users];
        const newSubjectsToCreate = [];
        const newClassesToCreate = [];

        parsedTeachers.forEach((item, idx) => {
          const finalSubjects = item.subjects.length > 0 ? item.subjects : [subjects[0] || 'Componente Curricular'];
          const finalClasses = item.classes;

          finalSubjects.forEach((s) => {
            if (!subjects.some((ex) => sameText(ex, s)) && !newSubjectsToCreate.some((ex) => sameText(ex, s))) {
              newSubjectsToCreate.push(s);
            }
          });

          finalClasses.forEach((c) => {
            if (!classes.some((ex) => sameClassGroup(ex.name, c)) && !newClassesToCreate.some((ex) => sameClassGroup(ex.name, c))) {
              newClassesToCreate.push({
                id: `cls-${Date.now()}-${idx}-${Math.random().toString(36).slice(2, 5)}`,
                name: c,
                grade: c,
                shift: 'Matutino',
                year: CURRENT_YEAR,
                room: '',
              });
            }
          });

          const existingIdx = nextUsers.findIndex(
            (u) => u.role === 'professor' && sameText(u.name, item.name)
          );

          if (existingIdx >= 0) {
            const existing = nextUsers[existingIdx];
            const mergedSubjects = Array.from(new Set([...extractTeacherSubjects(existing, []), ...finalSubjects]));
            const mergedClasses = Array.from(new Set([...extractTeacherClasses(existing), ...finalClasses]));
            nextUsers[existingIdx] = {
              ...existing,
              password: item.password || existing.password || '123',
              subject: mergedSubjects.join(', '),
              subjects: mergedSubjects,
              classes: mergedClasses,
            };
            updatedCount += 1;
          } else {
            nextUsers.push({
              id: `prof-${Date.now()}-${idx}-${Math.random().toString(36).slice(2, 5)}`,
              name: item.name,
              username: item.name,
              email: `${item.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '.')}@escola.gov.br`,
              password: item.password || '123',
              role: 'professor',
              subject: finalSubjects.join(', '),
              subjects: finalSubjects,
              classes: finalClasses,
            });
            createdCount += 1;
          }
        });

        setUsers(nextUsers);

        if (newSubjectsToCreate.length > 0) {
          const updatedSubjs = [...subjects, ...newSubjectsToCreate].sort((a, b) => a.localeCompare(b, 'pt-BR'));
          setSubjects(updatedSubjs);
          localStorage.setItem('pre_conselho_subjects', JSON.stringify(updatedSubjs));
          if (supabase) {
            await supabase.from('school_subjects').insert(
              newSubjectsToCreate.map((s, i) => ({ id: `subj-${Date.now()}-${i}`, name: s }))

        if (newClassesToCreate.length > 0) {
          setClasses((prev) => [...prev, ...newClassesToCreate]);
          if (supabase) {
            await supabase.from('school_classes').insert(newClassesToCreate);
          }

        if (supabase) {

            const basePayload = {
              id: p.id,
              name: p.name,
              username: p.username,
              email: p.email,
              password: p.password,
              role: 'professor',
              subject: p.subject,

              const retry = await supabase.from('users').upsert(basePayload);
              error = retry.error;
            }
            if (error) reportDbError(error, 'importar professores');
          }
        }

        return { createdCount, updatedCount };

                  <SchoolEntitiesManager
                    tab={activeTab}
                    teachers={teachers}
                    classes={classes}
                    students={students}
                    subjects={subjects}
                    onAddSubject={handleAddSubject}
                    onDeleteSubject={handleDeleteSubject}
                    onAddTeacher={handleAddTeacher}
                    onUpdateTeacher={handleUpdateTeacher}
                    onUpsertMultipleTeachers={handleUpsertMultipleTeachers}
                    onDeleteTeacher={handleDeleteTeacher}
                    onAddClass={handleAddClass}
                    onDeleteClass={handleDeleteClass}
                    onAddStudent={handleAddStudent}
                    onUpdateStudent={handleUpdateStudent}
                    onAddMultipleStudents={handleAddMultipleStudents}
                    onDeleteStudent={handleDeleteStudent}
                    onDeleteStudentsByClass={handleDeleteStudentsByClass}
                  />
                )}
                {activeTab === 'charts' && (
                  <ClassChartsDashboard
                    classes={classes}
                    teachers={teachers}
                    students={students}
                    reports={reports}
                  />
                )}
              </>
            ) : editingReport ? (
              <ReportForm
                currentUser={currentUser}
                questions={questions}
                sections={sections}
                report={editingReport}
                students={students}
                subjects={subjects}
                onSaveReport={handleSaveReport}
                onCancel={() => setEditingReport(null)}
              />
            ) : (
              <div className="max-w-5xl mx-auto px-4 py-6 space-y-4">
                <div className="bg-white p-5 rounded-2xl border border-stone-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <h2 className="text-lg font-bold text-stone-900">
                      {christmasMode ? '🎄 Minhas Fichas de Pré-Conselho' : 'Minhas Fichas de Pré-Conselho'}
                    </h2>
                    <p className="text-xs text-stone-500">Selecione o evento/trimestre liberado pela Direção para responder ou consultar.</p>
                  </div>

                  {myEvents.length > 0 && (
                    <select
                      value={teacherEventFilter}
                      onChange={(e) => setTeacherEventFilter(e.target.value)}
                      className="bg-red-50 border border-red-300 text-red-950 rounded-xl px-3 py-2 text-xs font-extrabold"
                    >
                      <option value="all">Todos os Eventos / Anos ({myReports.length})</option>
                      {myEvents.map((ev) => (
                        <option key={ev} value={ev}>{ev}</option>
                      ))}
                    </select>
                  )}
                </div>

                {visibleTeacherReports.length === 0 ? (
                  <div className="bg-white p-8 rounded-2xl border border-stone-200 text-center text-xs text-stone-500">
                    Nenhuma ficha liberada para você nesta seleção.
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {visibleTeacherReports.map((r) => {
                      const evLabel = normalizeEventLabel(r.trimester);
                      return (
                        <div key={r.id} className="bg-white p-5 rounded-2xl border border-stone-200 flex flex-col justify-between gap-4">
                          <div>
                            <div className="flex flex-wrap justify-between items-center gap-2 mb-2">
                              <div className="flex items-center gap-1.5">
                                <span className="px-2.5 py-1 bg-red-100 text-red-950 border border-red-300 rounded-full text-xs font-extrabold">
                                  {evLabel}
                                </span>
                                <span className="px-2.5 py-1 bg-stone-100 text-stone-800 rounded-full text-xs font-bold">
                                  {r.classGroup}
                                </span>
                              </div>
                              <span className="text-[11px] font-bold uppercase text-stone-500">{r.status}</span>
                            </div>
                            <h3 className="text-sm font-bold text-stone-900">{r.component}</h3>
                          </div>

                          {r.status === 'pendente' || r.status === 'rascunho' ? (
                            <button
                              type="button"
                              onClick={() => setEditingReport(r)}
                              className="w-full py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold rounded-xl cursor-pointer"
                            >
                              Preencher Ficha Agora
                            </button>
                          ) : (
                            <button
                              type="button"
                              onClick={() => setViewingReport(r)}
                              className="w-full py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-800 text-xs font-bold rounded-xl cursor-pointer"
                            >
                              Visualizar / Imprimir Ficha
                            </button>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </main>

          {showAccountSettings && currentUser.role === 'professor' && (
  <TeacherAccountSettings
    user={currentUser}
    users={users}
    onSave={handleSaveOwnAccount}
    onClose={() => setShowAccountSettings(false)}
  />
)}

          
          <AppFooter variant="page" christmasMode={christmasMode} />

          {viewingReport && (
            <ReportViewModal
              report={viewingReport}
              questions={questions}
              sections={sections}
              students={students}
              currentUser={currentUser}
              onClose={() => setViewingReport(null)}
              onSignReport={handleSignReport}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
