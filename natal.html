    const SCHOOL_NAME = 'ESCOLA ESTADUAL DO CAMPO FREI GRACIANO DROESSLER';

    const CURRENT_YEAR = new Date().getFullYear();
    const SCHOOL_YEARS = [2025, 2026, 2027, 2028, 2029, 2030];
    const TRIMESTERS = ['1º Trimestre', '2º Trimestre', '3º Trimestre'];

    const formatEventLabel = (year, periodName) => {
      const cleanPeriod = String(periodName || '').trim();
      if (!cleanPeriod) return `${year} • 1º Trimestre`;
      if (/^\d{4}\s*[•\-]/.test(cleanPeriod)) return cleanPeriod;
      return `${year} • ${cleanPeriod}`;
    };

    const normalizeEventLabel = (rawTrimester) => {
      const val = String(rawTrimester || '').trim();
      if (!val) return `${CURRENT_YEAR} • 1º Trimestre`;
      if (/^\d{4}\s*[•\-]/.test(val)) return val;
      return `2026 • ${val}`;
    };

    const sameText = (a, b) =>
      String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();

    const sameClassGroup = (a, b) => sameText(a, b);

    const extractTeacherSubjects = (teacher, fallbackSubjects = []) => {
      if (!teacher) return fallbackSubjects.length ? [fallbackSubjects[0]] : ['Componente Curricular'];
      const combined = [];

      if (Array.isArray(teacher.subjects)) {
        teacher.subjects.forEach((s) => {
          const clean = String(s || '').trim();
          if (clean && !combined.some((x) => sameText(x, clean))) combined.push(clean);
        });
      }

      if (teacher.subject) {
        String(teacher.subject)
          .split(/[,;|/]+/)
          .map((s) => s.trim())
          .filter(Boolean)
          .forEach((clean) => {
            if (!combined.some((x) => sameText(x, clean))) combined.push(clean);
          });
      }

      if (combined.length > 0) return combined;
      return fallbackSubjects.length ? [fallbackSubjects[0]] : ['Componente Curricular'];
    };

    const extractTeacherClasses = (teacher) => {
      if (!teacher) return [];
      const combined = [];

      if (Array.isArray(teacher.classes)) {
        teacher.classes.forEach((c) => {
          const clean = String(c || '').trim();
          if (clean && !combined.some((x) => sameClassGroup(x, clean))) combined.push(clean);
        });
      } else if (typeof teacher.classes === 'string' && teacher.classes.trim()) {
        teacher.classes
          .split(/[,;|/]+/)
          .map((c) => c.trim())
          .filter(Boolean)
          .forEach((clean) => {
            if (!combined.some((x) => sameClassGroup(x, clean))) combined.push(clean);
          });
      }

      return combined;
    };

    const collectAllClassNames = (classesList = [], teachersList = [], reportsList = [], studentsList = []) => {
      const unique = [];
      const pushUnique = (raw) => {
        const clean = String(raw || '').trim();
        if (clean && !unique.some((x) => sameClassGroup(x, clean))) {
          unique.push(clean);
        }
      };

      classesList.forEach((c) => pushUnique(typeof c === 'string' ? c : c?.name));
      teachersList.forEach((t) => extractTeacherClasses(t).forEach(pushUnique));
      reportsList.forEach((r) => pushUnique(r?.classGroup));
      studentsList.forEach((s) => pushUnique(s?.classGroup));

      return unique.sort((a, b) => a.localeCompare(b, 'pt-BR'));
    };

    // =========================================================================
    // 7. GERENCIAMENTO DE PERGUNTAS E SEÇÕES
    // =========================================================================
    function QuestionManagement({
      questions,
      sections,
      onAddQuestion,
      onUpdateQuestion,
      onDeleteQuestion,
      onAddSection,
      onDeleteSection,
    }) {
      const [showAddQuestion, setShowAddQuestion] = useState(false);
      const [showAddSection, setShowAddSection] = useState(false);
      const [editingQuestionId, setEditingQuestionId] = useState(null);
      const [questionToDelete, setQuestionToDelete] = useState(null);
      const [sectionToDelete, setSectionToDelete] = useState(null);

      const [targetSectionId, setTargetSectionId] = useState(sections[0]?.id || 'sec-1');
      const [promptText, setPromptText] = useState('');
      const [placeholderText, setPlaceholderText] = useState('');
      const [isRequired, setIsRequired] = useState(true);
      const [newSectionTitle, setNewSectionTitle] = useState('');
      const [feedback, setFeedback] = useState(null);

      const formRef = useRef(null);

      useEffect(() => {
        if (sections.length > 0 && !sections.some((s) => s.id === targetSectionId)) {
          setTargetSectionId(sections[0].id);
        }
      }, [sections]);

      const notify = (msg) => {
        setFeedback(msg);
        setTimeout(() => setFeedback(null), 3500);
      };

      const resetQuestionForm = () => {
        setPromptText('');
        setPlaceholderText('');
        setIsRequired(true);
        setEditingQuestionId(null);
        setShowAddQuestion(false);
      };

      const scrollToForm = () => {
        setTimeout(() => {
          formRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 50);
      };

      const handleEditClick = (q) => {
        setTargetSectionId(q.sectionId);
        setPromptText(q.prompt);
        setPlaceholderText(q.placeholder || '');
        setIsRequired(q.required);
        setEditingQuestionId(q.id);
        setShowAddQuestion(true);
        setShowAddSection(false);
        scrollToForm();
      };

      const handleSaveQuestion = async (e) => {
        e.preventDefault();
        if (!promptText.trim()) return;

        if (editingQuestionId) {
          const existing = questions.find((q) => q.id === editingQuestionId);
          if (existing) {
            await onUpdateQuestion({
              ...existing,
              sectionId: targetSectionId,
              prompt: promptText.trim(),
              placeholder: placeholderText.trim(),
              required: isRequired,
            });
            notify('Pergunta atualizada com sucesso!');
          }
        } else {
          const secQuestions = questions.filter((q) => q.sectionId === targetSectionId);
          await onAddQuestion({
            id: `q-${Date.now()}`,
            sectionId: targetSectionId,
            prompt: promptText.trim(),
            placeholder: placeholderText.trim(),
            required: isRequired,
            order: secQuestions.length + 1,
          });
          notify('Nova pergunta cadastrada no questionário oficial!');
        }
        resetQuestionForm();
      };

      const handleCreateSection = async (e) => {
        e.preventDefault();
        if (!newSectionTitle.trim()) return;
        await onAddSection(newSectionTitle.trim());
        notify(`Nova seção "${newSectionTitle.trim()}" criada!`);
        setNewSectionTitle('');
        setShowAddSection(false);
      };

      const sortedSections = [...sections].sort((a, b) => a.order - b.order);
      const questionsInSectionToDelete = sectionToDelete
        ? questions.filter((q) => q.sectionId === sectionToDelete.id)
        : [];

      return (
        <div className="max-w-5xl mx-auto px-4 py-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
              <div className="flex items-center gap-2">
                <Icon name="help" className="w-5 h-5 text-red-700" />
                <h2 className="text-xl font-bold text-stone-900">
                  Gerenciar Perguntas da Ficha de Pré-Conselho
                </h2>
              </div>
              <p className="text-xs text-stone-500 mt-1">
                Organize as seções e cadastre as perguntas oficiais que os professores responderão antes de cada evento de Conselho de Classe.
              </p>
            </div>

            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={() => {
                  setShowAddSection(!showAddSection);
                  setShowAddQuestion(false);
                }}
                className="px-3.5 py-2 bg-white border border-stone-300 hover:bg-stone-50 text-stone-700 text-xs font-semibold rounded-xl shadow-xs cursor-pointer"
              >
                + Nova Seção
              </button>

              <button
                type="button"
                onClick={() => {
                  resetQuestionForm();
                  setShowAddQuestion(true);
                  setShowAddSection(false);
                  scrollToForm();
                }}
                className="flex items-center gap-1.5 px-4 py-2 bg-red-700 hover:bg-red-800 text-white text-xs font-bold rounded-xl shadow-xs cursor-pointer"
              >
                <Icon name="plus" className="w-4 h-4" />
                <span>Cadastrar Pergunta</span>
              </button>
            </div>
          </div>

          {feedback && (
            <div className="mb-6 bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3 rounded-xl text-xs flex items-center gap-2 shadow-xs">
              <Icon name="check" className="w-4 h-4 text-emerald-600 shrink-0" />
              <span className="font-medium">{feedback}</span>
            </div>
          )}

          {showAddSection && (
            <form
              onSubmit={handleCreateSection}
              className="bg-white rounded-2xl border-2 border-red-300 p-5 mb-6 shadow-sm flex flex-col sm:flex-row items-end gap-3"
            >
              <div className="flex-1 w-full">
                <label className="block text-xs font-bold text-stone-700 mb-1">
                  Título da Nova Seção do Questionário *
                </label>
                <input
                  type="text"
                  required
                  placeholder="Ex: 7. PROJETOS INTERDISCIPLINARES E CONVIVÊNCIA"
                  value={newSectionTitle}
                  onChange={(e) => setNewSectionTitle(e.target.value)}
                  className="w-full bg-stone-50 border border-stone-300 rounded-xl px-3.5 py-2 text-xs text-stone-900 focus:bg-white focus:ring-2 focus:ring-red-500 outline-none"
                />
              </div>
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => setShowAddSection(false)}
                  className="px-3.5 py-2 text-xs font-semibold text-stone-600 hover:bg-stone-100 rounded-xl cursor-pointer"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 text-xs font-bold text-white bg-red-700 hover:bg-red-800 rounded-xl cursor-pointer"
                >
                  Criar Seção
                </button>
              </div>
            </form>
          )}

          {showAddQuestion && (
            <div ref={formRef} className="bg-white rounded-2xl border-2 border-red-400 p-6 mb-8 shadow-md">
              <div className="flex items-center justify-between pb-3 mb-4 border-b border-stone-200">
                <h3 className="text-sm font-bold text-stone-900">
                  {editingQuestionId ? 'Editar Pergunta Oficial' : 'Cadastrar Nova Pergunta na Ficha'}
                </h3>
                <button
                  type="button"
                  onClick={resetQuestionForm}
                  className="text-stone-400 hover:text-stone-700 text-xs font-semibold cursor-pointer"
                >
                  Fechar
                </button>
              </div>

              <form onSubmit={handleSaveQuestion} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">
                    Seção de Destino *
                  </label>
                  <select
                    value={targetSectionId}
                    onChange={(e) => setTargetSectionId(e.target.value)}
                    className="w-full bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-xs text-stone-900 font-semibold focus:bg-white focus:ring-2 focus:ring-red-500 outline-none"
                  >

                  <label className="block text-xs font-bold text-stone-700 mb-1">

                  <textarea
                    rows={3}
                    required
                    placeholder="Ex: Como foi a participação e pontualidade da turma na entrega das tarefas?"
                    value={promptText}

                    className="w-full bg-stone-50 border border-stone-300 rounded-xl p-3 text-xs text-stone-900 focus:bg-white focus:ring-2 focus:ring-red-500 outline-none"
                  />

                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">

                  </label>
                  <input
                    type="text"
                    placeholder="Ex: Cite exemplos concretos de postura ou atividades realizadas..."
                    value={placeholderText}
                    onChange={(e) => setPlaceholderText(e.target.value)}
                    className="w-full bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-xs text-stone-900 focus:bg-white focus:ring-2 focus:ring-red-500 outline-none"
                  />
                </div>

                <div className="flex items-center gap-2">
                  <input
                    type="checkbox"
                    id="req-checkbox"
                    checked={isRequired}
                    onChange={(e) => setIsRequired(e.target.checked)}

                  <label htmlFor="req-checkbox" className="text-xs font-medium text-stone-700 cursor-pointer">

                <div className="pt-3 flex items-center justify-end gap-2 border-t border-stone-100">

                    onClick={resetQuestionForm}
                    className="px-4 py-2 text-xs font-semibold text-stone-600 hover:bg-stone-100 rounded-xl cursor-pointer"
                  >
                    Cancelar

                  <button

                    className="px-5 py-2 text-xs font-bold text-white bg-red-700 hover:bg-red-800 rounded-xl shadow-xs cursor-pointer"
                  >
                    {editingQuestionId ? 'Salvar Edição' : 'Salvar Pergunta'}

              </form>

          <div className="space-y-6">
            {sortedSections.map((sec) => {
              const secQuestions = questions
                .filter((q) => q.sectionId === sec.id)
                .sort((a, b) => a.order - b.order);

              return (
                <div key={sec.id} className="bg-white rounded-2xl border border-stone-200 overflow-hidden shadow-xs">
                  <div className="p-4 bg-stone-50 border-b border-stone-200 flex flex-wrap items-center justify-between gap-2">
                    <div className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full bg-red-600" />
                      <h3 className="text-xs sm:text-sm font-bold text-stone-900 uppercase font-serif">
                        {sec.title}
                      </h3>
                      <span className="text-[11px] text-stone-500 ml-1">
                        ({secQuestions.length} {secQuestions.length === 1 ? 'pergunta' : 'perguntas'})
                      </span>
                    </div>

                    <div className="flex items-center gap-1.5">
                      <button
                        type="button"
                        onClick={() => {
                          setTargetSectionId(sec.id);
                          setEditingQuestionId(null);
                          setPromptText('');
                          setPlaceholderText('');
                          setShowAddQuestion(true);
                          scrollToForm();
                        }}
                        className="text-xs text-red-800 hover:bg-red-100/70 font-semibold flex items-center gap-1 px-2.5 py-1.5 rounded-lg transition-colors cursor-pointer"
                      >
                        <Icon name="plus" className="w-3.5 h-3.5" />
                        <span>Adicionar pergunta</span>
                      </button>

                      <button
                        type="button"
                        onClick={() => setSectionToDelete(sec)}
                        className="p-1.5 text-stone-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors cursor-pointer"
                        title="Excluir seção"
                      >
                        <Icon name="trash" className="w-4 h-4" />
                      </button>
                    </div>
                  </div>

                  <div className="divide-y divide-stone-100">
                    {secQuestions.length === 0 ? (
                      <div className="p-6 text-center text-xs text-stone-400">
                        Nenhuma pergunta cadastrada nesta seção ainda.
                      </div>
                    ) : (
                      secQuestions.map((q, idx) => (
                        <div key={q.id} className="p-4 hover:bg-stone-50/70 flex items-start justify-between gap-4">
                          <div className="flex items-start gap-3">
                            <span className="w-6 h-6 rounded-full bg-red-50 border border-red-200 text-red-900 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">
                              {idx + 1}
                            </span>
                            <div>
                              <p className="text-xs sm:text-sm font-semibold text-stone-800 leading-snug">
                                {q.prompt}
                                {q.required && <span className="text-red-600 ml-1 font-bold">*</span>}
                              </p>
                              {q.placeholder && (
                                <p className="text-[11px] text-stone-500 mt-1 italic">
                                  Orientação: "{q.placeholder}"
                                </p>
                              )}
                            </div>
                          </div>

                          <div className="flex items-center gap-1 shrink-0">
                            <button
                              type="button"
                              onClick={() => handleEditClick(q)}
                              className="p-1.5 text-stone-400 hover:text-stone-800 hover:bg-stone-200 rounded-lg cursor-pointer"
                              title="Editar pergunta"
                            >
                              <Icon name="edit" className="w-4 h-4" />
                            </button>
                            <button
                              type="button"
                              onClick={() => setQuestionToDelete(q)}
                              className="p-1.5 text-stone-400 hover:text-red-600 hover:bg-red-50 rounded-lg cursor-pointer"
                              title="Excluir pergunta"
                            >
                              <Icon name="trash" className="w-4 h-4" />
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          <ConfirmDialog
            isOpen={!!questionToDelete}
            title="Excluir Pergunta"
            message="Deseja realmente remover esta questão do questionário oficial de pré-conselho?"
            confirmText="Sim, Excluir"
            onConfirm={async () => {
              if (questionToDelete) {
                await onDeleteQuestion(questionToDelete.id);
                setQuestionToDelete(null);
              }
            }}
            onCancel={() => setQuestionToDelete(null)}
          />

          <ConfirmDialog
            isOpen={!!sectionToDelete}
            title="Excluir Seção"
            message={
              questionsInSectionToDelete.length > 0
                ? `A seção "${sectionToDelete?.title}" possui ${questionsInSectionToDelete.length} pergunta(s) que também serão removidas. Deseja continuar?`
                : `Deseja realmente excluir a seção "${sectionToDelete?.title}"?`
            }
            confirmText="Sim, Excluir Seção"
            onConfirm={async () => {
              if (sectionToDelete) {
                await onDeleteSection(sectionToDelete.id);
                setSectionToDelete(null);
              }
            }}
            onCancel={() => setSectionToDelete(null)}
          />
        </div>
      );
    }

    // =========================================================================
    // 8. LIBERAÇÃO, REABERTURA E EXCLUSÃO DE FICHAS POR EVENTO / ANO LETIVO
    // =========================================================================
    function ReleaseReportManagement({
      teachers,
      reports,
      classes,
      subjects,
      onReleaseReports,
      onDeleteReport,
      onReopenReport,
      onOpenReport,
    }) {
      const [eventYear, setEventYear] = useState(CURRENT_YEAR);
      const [trimesterPreset, setTrimesterPreset] = useState('1º Trimestre');
      const [customEventName, setCustomEventName] = useState('');
      const [releaseMode, setReleaseMode] = useState('all');
      const [selectedTeacherId, setSelectedTeacherId] = useState(teachers[0]?.id || '');
      const [selectedTeacherSubjects, setSelectedTeacherSubjects] = useState([]);
      const [selectedTeacherClasses, setSelectedTeacherClasses] = useState([]);

      const [filterEvent, setFilterEvent] = useState('all');
      const [filterClass, setFilterClass] = useState('all');
      const [filterStatus, setFilterStatus] = useState('all');
      const [reportToDelete, setReportToDelete] = useState(null);
      const [reportToReopen, setReportToReopen] = useState(null);
      const [feedback, setFeedback] = useState(null);

      useEffect(() => {
        if (teachers.length > 0 && !teachers.some((t) => t.id === selectedTeacherId)) {
          setSelectedTeacherId(teachers[0].id);
        }
      }, [teachers]);

      const activeTeacher = teachers.find((t) => t.id === selectedTeacherId) || teachers[0];

      useEffect(() => {
        if (!activeTeacher) return;
        const tSubjs = extractTeacherSubjects(activeTeacher, subjects);
        const tClasses = extractTeacherClasses(activeTeacher);
        const initialClasses =
          tClasses.length > 0 ? tClasses : [classes[0]?.name || '6º Ano A'];

        setSelectedTeacherSubjects(tSubjs);
        setSelectedTeacherClasses(initialClasses);
      }, [selectedTeacherId, teachers]);

      const notify = (msg) => {
        setFeedback(msg);
        setTimeout(() => setFeedback(null), 5000);
      };

      const targetEventLabel = formatEventLabel(
        eventYear,
        trimesterPreset === 'custom' ? (customEventName || 'Conselho Extraordinário') : trimesterPreset
      );

      const allEvents = Array.from(
        new Set([targetEventLabel, ...reports.map((r) => normalizeEventLabel(r.trimester))])
      ).sort((a, b) => b.localeCompare(a, 'pt-BR'));

      const specificCombinationsCount =
        releaseMode === 'specific'
          ? selectedTeacherSubjects.length * selectedTeacherClasses.length
          : 0;

      const handleRelease = async (e) => {
        e.preventDefault();
        if (trimesterPreset === 'custom' && !customEventName.trim()) {
          notify('Digite o nome do Evento de Conselho personalizado antes de liberar.');
          return;
        }

        const todayStr = new Date().toISOString().split('T')[0];
        const created = [];

        if (releaseMode === 'all') {
          teachers.forEach((teacher) => {
            const tClasses = extractTeacherClasses(teacher);
            const targetClasses = tClasses.length ? tClasses : [classes[0]?.name || '6º Ano A'];
            const targetSubjects = extractTeacherSubjects(teacher, subjects);
            targetClasses.forEach((cls) => {
              targetSubjects.forEach((subj) => {
                const exists = reports.some(
                  (r) =>
                    r.teacherId === teacher.id &&
                    sameClassGroup(r.classGroup, cls) &&
                    sameText(r.component, subj) &&
                    normalizeEventLabel(r.trimester) === targetEventLabel
                );
                if (!exists) {
                  created.push({
                    id: `rep-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
                    schoolName: SCHOOL_NAME,
                    schoolSubtitle: SCHOOL_SUBTITLE,
                    title: REPORT_TITLE,
                    teacherId: teacher.id,
                    teacherName: teacher.name,
                    component: subj,
                    classGroup: cls.trim(),
                    date: todayStr,
                    trimester: targetEventLabel,
                    answers: {},
                    dimensionRatings: {},
                    studentRatings: {},
                    status: 'pendente',
                    pedagogaSignature: { signed: false },
                    diretoraSignature: { signed: false },
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString(),
                  });
                }
              });
            });
          });
        } else {
          if (!activeTeacher) return;
          if (selectedTeacherSubjects.length === 0 || selectedTeacherClasses.length === 0) {
            notify('Selecione pelo menos uma matéria e uma turma do professor antes de liberar.');
            return;
          }

          selectedTeacherClasses.forEach((cls) => {
            selectedTeacherSubjects.forEach((subj) => {
              const exists = reports.some(
                (r) =>
                  r.teacherId === activeTeacher.id &&
                  sameClassGroup(r.classGroup, cls) &&
                  sameText(r.component, subj) &&
                  normalizeEventLabel(r.trimester) === targetEventLabel
              );
              if (!exists) {
                created.push({
                  id: `rep-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
                  schoolName: SCHOOL_NAME,
                  schoolSubtitle: SCHOOL_SUBTITLE,
                  title: REPORT_TITLE,
                  teacherId: activeTeacher.id,
                  teacherName: activeTeacher.name,
                  component: subj,
                  classGroup: cls.trim(),
                  date: todayStr,
                  trimester: targetEventLabel,
                  answers: {},
                  dimensionRatings: {},
                  studentRatings: {},
                  status: 'pendente',
                  pedagogaSignature: { signed: false },
                  diretoraSignature: { signed: false },
                  createdAt: new Date().toISOString(),
                  updatedAt: new Date().toISOString(),
                });
              }
            });
          });
        }

        if (created.length === 0) {
          notify(`Todas as fichas selecionadas para o evento "${targetEventLabel}" já foram liberadas anteriormente.`);
        } else {
          await onReleaseReports(created);
          setFilterEvent(targetEventLabel);
          notify(`${created.length} ficha(s) disponibilizada(s) para o evento "${targetEventLabel}"!`);
        }
      };

      const filteredReports = reports.filter((r) => {
        if (filterEvent !== 'all' && normalizeEventLabel(r.trimester) !== filterEvent) return false;
        if (filterClass !== 'all' && !sameClassGroup(r.classGroup, filterClass)) return false;
        if (filterStatus !== 'all' && r.status !== filterStatus) return false;
        return true;
      });

      const activeTeacherRegisteredSubjects = activeTeacher ? extractTeacherSubjects(activeTeacher, subjects) : [];
      const activeTeacherRegisteredClasses = activeTeacher ? extractTeacherClasses(activeTeacher) : [];

      const allSelectableSubjects = [];
      [...subjects, ...activeTeacherRegisteredSubjects].forEach((s) => {
        const clean = String(s || '').trim();
        if (clean && !allSelectableSubjects.some((x) => sameText(x, clean))) {
          allSelectableSubjects.push(clean);
        }
      });

      const allSelectableClassNames = collectAllClassNames(classes, teachers, reports, []);

      return (
        <div className="max-w-5xl mx-auto px-4 py-6 space-y-6">
          <div className="bg-white p-6 rounded-2xl border border-stone-200 shadow-xs">
            <div className="flex items-center gap-2">
              <Icon name="calendar" className="w-5 h-5 text-red-700" />
              <h2 className="text-lg font-bold text-stone-900">
                Criar Evento de Conselho e Liberar Fichas
              </h2>
            </div>
            <p className="text-xs text-stone-500 mt-1">
              Cada liberação fica vinculada ao <strong>Ano Letivo e Evento</strong> escolhido (ex: <em>2026 • 1º Trimestre</em>, <em>2027 • 1º Trimestre</em>), mantendo os relatórios de cada ano totalmente separados e sem duplicidade.
            </p>

            {feedback && (
              <div className="mt-4 p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-800 font-medium">
                {feedback}
              </div>
            )}

            <form onSubmit={handleRelease} className="mt-5 space-y-4">
              <div className="p-4 rounded-2xl bg-red-50/50 border border-red-200 space-y-3">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">
                      Ano Letivo *
                    </label>
                    <select
                      value={eventYear}
                      onChange={(e) => setEventYear(Number(e.target.value))}
                      className="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs font-extrabold text-stone-900"
                    >
                      {SCHOOL_YEARS.map((yr) => (
                        <option key={yr} value={yr}>{yr}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">
                      Período / Tipo de Evento *
                    </label>
                    <select
                      value={trimesterPreset}
                      onChange={(e) => setTrimesterPreset(e.target.value)}
                      className="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs font-semibold text-stone-900"
                    >
                      {TRIMESTERS.map((t) => (
                        <option key={t} value={t}>{t}</option>
                      ))}
                      <option value="Conselho Final / Recuperação">Conselho Final / Recuperação</option>
                      <option value="custom">+ Outro Evento Personalizado...</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">
                      Identificação do Evento Gerado
                    </label>
                    <div className="w-full bg-emerald-100/80 border border-emerald-300 rounded-xl px-3 py-2 text-xs font-extrabold text-emerald-950 truncate">
                      {targetEventLabel}
                    </div>
                  </div>
                </div>

                {trimesterPreset === 'custom' && (
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">
                      Nome do Evento Personalizado *
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="Ex: Pré-Conselho Diagnóstico, 1º Bimestre, Conselho Extraordinário..."
                      value={customEventName}
                      onChange={(e) => setCustomEventName(e.target.value)}
                      className="w-full bg-white border border-stone-300 rounded-xl px-3.5 py-2 text-xs text-stone-900 focus:ring-2 focus:ring-red-500 outline-none"
                    />
                  </div>
                )}
              </div>

              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">Modo de Liberação</label>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  <label className={`flex items-center gap-2 p-2.5 rounded-xl border text-xs cursor-pointer transition-colors ${
                    releaseMode === 'all' ? 'bg-red-50 border-red-400 font-bold text-red-950' : 'border-stone-200 bg-stone-50'
                  }`}>
                    <input type="radio" checked={releaseMode === 'all'} onChange={() => setReleaseMode('all')} />
                    <span>Todos os Professores (Lote completo do Evento)</span>
                  </label>
                  <label className={`flex items-center gap-2 p-2.5 rounded-xl border text-xs cursor-pointer transition-colors ${
                    releaseMode === 'specific' ? 'bg-red-50 border-red-400 font-bold text-red-950' : 'border-stone-200 bg-stone-50'
                  }`}>
                    <input type="radio" checked={releaseMode === 'specific'} onChange={() => setReleaseMode('specific')} />
                    <span>Apenas UM Professor (Escolher turmas e matérias)</span>
                  </label>
                </div>
              </div>

              {releaseMode === 'specific' && (
                <div className="p-4 bg-stone-50 rounded-2xl border border-stone-200 space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">
                      1. Selecione o Professor *
                    </label>
                    <select
                      value={selectedTeacherId}
                      onChange={(e) => setSelectedTeacherId(e.target.value)}
                      className="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs font-bold text-stone-900"
                    >
                      {teachers.map((t) => {
                        const listSubj = extractTeacherSubjects(t, subjects).join(', ');
                        const listCls = extractTeacherClasses(t).join(', ');
                        return (
                          <option key={t.id} value={t.id}>
                            {t.name} — Matérias: [{listSubj}] • Turmas: [{listCls || 'Nenhuma'}]
                          </option>
                        );
                      })}
                    </select>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="bg-white p-3.5 rounded-xl border border-stone-200">
                      <div className="flex items-center justify-between mb-2">
                        <label className="text-xs font-bold text-stone-800">
                          2. Matérias ({selectedTeacherSubjects.length} marcada{selectedTeacherSubjects.length === 1 ? '' : 's'})
                        </label>
                        <div className="flex items-center gap-2">
                          <button
                            type="button"
                            onClick={() => setSelectedTeacherSubjects(activeTeacherRegisteredSubjects)}
                            className="text-[11px] font-semibold text-red-800 hover:underline cursor-pointer"
                          >
                            Todas do prof. ({activeTeacherRegisteredSubjects.length})
                          </button>
                          <button
                            type="button"
                            onClick={() => setSelectedTeacherSubjects([])}
                            className="text-[11px] font-semibold text-stone-500 hover:underline cursor-pointer"
                          >
                            Limpar
                          </button>
                        </div>
                      </div>

                      <div className="flex flex-wrap gap-1.5 max-h-48 overflow-y-auto pr-1">
                        {allSelectableSubjects.map((subj) => {
                          const isTeacherSubj = activeTeacherRegisteredSubjects.some((ts) =>
                            sameText(ts, subj)
                          );
                          const isChecked = selectedTeacherSubjects.some((ss) =>
                            sameText(ss, subj)
                          );
                          return (
                            <label
                              key={subj}
                              className={`text-xs flex items-center gap-1.5 px-2.5 py-1 rounded-lg border cursor-pointer transition-colors ${
                                isChecked
                                  ? 'bg-emerald-50 border-emerald-400 text-emerald-900 font-bold'
                                  : isTeacherSubj
                                  ? 'bg-emerald-50/40 border-emerald-200 text-stone-800'
                                  : 'bg-stone-50 border-stone-200 text-stone-600'
                              }`}
                            >
                              <input
                                type="checkbox"
                                checked={isChecked}
                                onChange={() =>
                                  setSelectedTeacherSubjects((prev) =>
                                    prev.some((x) => sameText(x, subj))
                                      ? prev.filter((x) => !sameText(x, subj))
                                      : [...prev, subj]
                                  )
                                }
                              />
                              <span>{subj}</span>
                            </label>
                          );
                        })}
                      </div>
                    </div>

                    <div className="bg-white p-3.5 rounded-xl border border-stone-200">
                      <div className="flex items-center justify-between mb-2">
                        <label className="text-xs font-bold text-stone-800">
                          3. Turmas de {activeTeacher?.name} ({selectedTeacherClasses.length} marcada{selectedTeacherClasses.length === 1 ? '' : 's'})
                        </label>
                        <div className="flex items-center gap-2">
                          {activeTeacherRegisteredClasses.length > 0 && (
                            <button
                              type="button"
                              onClick={() => setSelectedTeacherClasses(activeTeacherRegisteredClasses)}
                              className="text-[11px] font-semibold text-red-800 hover:underline cursor-pointer"
                            >
                              Todas do prof. ({activeTeacherRegisteredClasses.length})
                            </button>
                          )}
                          <button
                            type="button"
                            onClick={() => setSelectedTeacherClasses([])}
                            className="text-[11px] font-semibold text-stone-500 hover:underline cursor-pointer"
                          >
                            Limpar
                          </button>
                        </div>
                      </div>

                      <div className="flex flex-wrap gap-1.5 max-h-48 overflow-y-auto pr-1">
                        {allSelectableClassNames.map((clsName) => {
                          const belongsToTeacher = activeTeacherRegisteredClasses.some((tc) =>
                            sameClassGroup(tc, clsName)
                          );
                          const isChecked = selectedTeacherClasses.some((sc) =>
                            sameClassGroup(sc, clsName)
                          );
                          return (
                            <label
                              key={clsName}
                              className={`text-xs flex items-center gap-1.5 px-2.5 py-1 rounded-lg border cursor-pointer transition-colors ${
                                isChecked
                                  ? 'bg-red-100 border-red-500 text-red-950 font-bold'
                                  : belongsToTeacher
                                  ? 'bg-red-50/40 border-red-200 text-stone-800'
                                  : 'bg-stone-50 border-stone-200 text-stone-600'
                              }`}
                            >
                              <input
                                type="checkbox"
                                checked={isChecked}
                                onChange={() =>
                                  setSelectedTeacherClasses((prev) =>
                                    prev.some((x) => sameClassGroup(x, clsName))
                                      ? prev.filter((x) => !sameClassGroup(x, clsName))
                                      : [...prev, clsName]
                                  )
                                }
                              />
                              <span>{clsName}</span>
                            </label>
                          );
                        })}
                      </div>
                    </div>
                  </div>

                            {eventDisplay}

                          <span className="font-bold text-xs text-stone-900">{r.classGroup}</span>
                          <span className="text-stone-300">•</span>

    // =========================================================================
    // 9. FORMULÁRIO DE PREENCHIMENTO DO PROFESSOR
    // =========================================================================
    function ReportForm({ currentUser, questions, sections, report, students, subjects, onSaveReport, onCancel }) {
      const [component, setComponent] = useState(report?.component || currentUser.subject || 'Matemática');
      const [answers, setAnswers] = useState(report?.answers || {});
      const [dimensionRatings, setDimensionRatings] = useState(report?.dimensionRatings || {});
      const [studentRatings, setStudentRatings] = useState(report?.studentRatings || {});
      const [errors, setErrors] = useState([]);

      const eventDisplay = normalizeEventLabel(report.trimester);

      const classStudents = students
        .filter((s) => sameClassGroup(s.classGroup, report.classGroup))
        .sort((a, b) => (a.rollNumber || '').localeCompare(b.rollNumber || '') || (a.name || '').localeCompare(b.name || ''));

      const sortedSections = [...sections].sort((a, b) => a.order - b.order);

      const buildCleanStudentRatings = () => {
        const clean = {};
        classStudents.forEach((std) => {
          if (isStudentTransferred(std)) return;
          clean[std.id] = studentRatings[std.id] || { rating: 'bom', notes: '' };
        });
        return clean;
      };

      const handleSaveDraft = async () => {
        await onSaveReport({
          ...report,
          component,
          answers,
          dimensionRatings,
          studentRatings: buildCleanStudentRatings(),
          status: 'rascunho',
          updatedAt: new Date().toISOString(),
        });
      };

      const handleSubmitFinal = async (e) => {
        e.preventDefault();
        const missing = [];
        questions.forEach((q) => {
          if (q.required && (!answers[q.id] || !answers[q.id].trim())) {
            missing.push(`Obrigatória: "${q.prompt}"`);
          }
        });
        if (missing.length > 0) {
          setErrors(missing);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        await onSaveReport({
          ...report,
          component,
          answers,
          dimensionRatings,
          studentRatings: buildCleanStudentRatings(),
          status: 'enviado',
          updatedAt: new Date().toISOString(),
        });
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-6">
          <button
            type="button"
            onClick={onCancel}
            className="mb-4 px-3.5 py-2 bg-white border border-stone-200 rounded-xl text-xs font-semibold text-stone-700 hover:bg-stone-100 cursor-pointer"
          >
            ← Voltar para Minhas Fichas
          </button>

          {errors.length > 0 && (
            <div className="mb-5 p-4 bg-red-50 border border-red-200 rounded-xl text-xs text-red-800">
              <p className="font-bold mb-1">Preencha as questões obrigatórias:</p>
              <ul className="list-disc list-inside">
                {errors.map((err, idx) => <li key={idx}>{err}</li>)}
              </ul>
            </div>
          )}

          <form onSubmit={handleSubmitFinal} className="bg-white rounded-2xl border border-stone-200 shadow-sm overflow-hidden">
            <div className="p-6 bg-stone-50 border-b border-stone-200 text-center">
              <h2 className="text-base font-extrabold uppercase font-serif text-stone-900">{SCHOOL_NAME}</h2>
              <p className="text-xs font-bold uppercase text-red-800 mt-1">{REPORT_TITLE}</p>

              <div className="mt-5 grid grid-cols-1 sm:grid-cols-4 gap-3 text-left text-xs pt-4 border-t border-stone-200">
                <div>
                  <label className="font-bold text-stone-600 block mb-1">Componente:</label>
                  <select
                    value={component}
                    onChange={(e) => setComponent(e.target.value)}
                    className="w-full bg-white border border-stone-300 rounded-lg px-2.5 py-1.5 font-semibold"
                  >
                    {subjects.map((s) => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
                <div>
                  <label className="font-bold text-stone-600 block mb-1">Professor(a):</label>
                  <input readOnly value={currentUser.name} className="w-full bg-stone-100 border border-stone-300 rounded-lg px-2.5 py-1.5 font-medium" />
                </div>
                <div>
                  <label className="font-bold text-stone-600 block mb-1">Turma:</label>
                  <input readOnly value={report.classGroup} className="w-full bg-stone-100 border border-stone-300 rounded-lg px-2.5 py-1.5 font-bold" />
                </div>
                <div>
                  <label className="font-bold text-stone-600 block mb-1">Evento / Trimestre:</label>
                  <input readOnly value={eventDisplay} className="w-full bg-red-50 border border-red-300 text-red-950 rounded-lg px-2.5 py-1.5 font-extrabold" />
                </div>
              </div>
            </div>

            <div className="p-6 space-y-6">
              <div className="p-5 bg-red-50/30 rounded-2xl border border-red-200">
                <h3 className="text-xs font-extrabold uppercase text-stone-900 mb-3 font-serif">
                  Avaliação Conceitual da Turma por Critérios Pedagógicos
                </h3>
                <div className="space-y-3">
                  {EVALUATION_DIMENSIONS.map((dim) => (
                    <div key={dim.id} className="bg-white p-3 rounded-xl border border-stone-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                      <div>
                        <p className="text-xs font-bold text-stone-900">{dim.name}</p>
                        <p className="text-[11px] text-stone-500">{dim.description}</p>
                      </div>
                      <div className="grid grid-cols-4 gap-1 shrink-0">
                        {[
                          { id: 'ruim', label: 'Ruim', active: 'bg-rose-600 text-white' },
                          { id: 'regular', label: 'Regular', active: 'bg-amber-600 text-white' },
                          { id: 'bom', label: 'Bom', active: 'bg-blue-600 text-white' },
                          { id: 'otimo', label: 'Ótimo', active: 'bg-emerald-600 text-white' },
                        ].map((opt) => (
                          <button
                            key={opt.id}
                            type="button"
                            onClick={() => setDimensionRatings((p) => ({ ...p, [dim.id]: opt.id }))}
                            className={`px-2.5 py-1 rounded-lg text-[11px] font-bold border border-stone-200 cursor-pointer ${
                              dimensionRatings[dim.id] === opt.id ? opt.active : 'bg-stone-50 text-stone-700 hover:bg-stone-100'
                            }`}
                          >
                            {opt.label}
                          </button>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {classStudents.length > 0 ? (
                <div className="p-5 bg-stone-50 rounded-2xl border border-stone-200">
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                    <h3 className="text-xs font-extrabold uppercase text-stone-900 font-serif">
                      Avaliação Individual dos Estudantes — {report.classGroup} ({classStudents.length})
                    </h3>
                    <span className="text-[11px] text-stone-500">
                      Estudantes transferidos não recebem conceitos avaliativos.
                    </span>
                  </div>
                  <div className="bg-white rounded-xl border border-stone-200 divide-y divide-stone-100">
                    {classStudents.map((std) => {
                      const transferred = isStudentTransferred(std);
                      const cur = studentRatings[std.id] || { rating: 'bom', notes: '' };
                      return (
                        <div
                          key={std.id}
                          className={`p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2 ${
                            transferred ? 'bg-stone-100/80 opacity-85' : ''
                          }`}
                        >
                          <div className="sm:w-1/3 flex flex-wrap items-center gap-1.5">
                            <span className={`text-xs font-bold ${transferred ? 'text-stone-500 line-through' : 'text-stone-900'}`}>
                              {std.rollNumber ? `${std.rollNumber}. ` : ''}{std.name}
                            </span>
                            {std.notes && (
                              <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold border ${
                                transferred
                                  ? 'bg-red-50 text-red-700 border-red-200'
                                  : 'bg-amber-50 text-amber-800 border-amber-200'
                              }`}>
                                {std.notes}
                              </span>
                            )}
                          </div>

                          {transferred ? (
                            <>
                              <div className="flex items-center">
                                <span className="px-3 py-1 rounded-lg bg-red-100 text-red-800 border border-red-300 text-[11px] font-extrabold uppercase tracking-wide">
                                  Transferido — Sem Avaliação
                                </span>
                              </div>
                              <input
                                type="text"
                                disabled
                                value="Aluno transferido (não avaliado)"
                                className="sm:w-1/3 bg-stone-100 border border-stone-200 rounded-lg px-2.5 py-1 text-xs text-stone-400 italic cursor-not-allowed"
                              />
                            </>
                          ) : (
                            <>
                              <div className="flex gap-1">
                                {[
                                  { id: 'ruim', label: 'Ruim', active: 'bg-rose-600 text-white border-rose-700' },
                                  { id: 'regular', label: 'Regular', active: 'bg-red-500 text-white border-red-600' },
                                  { id: 'bom', label: 'Bom', active: 'bg-emerald-600 text-white border-emerald-700' },
                                  { id: 'otimo', label: 'Ótimo', active: 'bg-emerald-700 text-white border-emerald-800' },
                                ].map((opt) => (
                                  <button
                                    key={opt.id}
                                    type="button"
                                    onClick={() => setStudentRatings((p) => ({ ...p, [std.id]: { ...cur, rating: opt.id } }))}
                                    className={`px-2 py-1 rounded text-[11px] font-bold border cursor-pointer transition-colors ${
                                      cur.rating === opt.id ? opt.active : 'bg-stone-50 text-stone-600 border-stone-200 hover:bg-stone-100'

                                  >
                                    {opt.label}

                                ))}

                              <input
                                type="text"
                                placeholder="Observação individual..."
                                value={cur.notes || ''}
                                onChange={(e) => setStudentRatings((p) => ({ ...p, [std.id]: { ...cur, notes: e.target.value } }))}
                                className="sm:w-1/3 bg-stone-50 border border-stone-300 rounded-lg px-2.5 py-1 text-xs"
                              />

                          )}

                    })}
                  </div>

              ) : (
                <div className="p-4 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900">
                  Nenhum estudante cadastrado ainda para a turma <strong>{report.classGroup}</strong>. A Direção pode importar a lista desta turma na aba "6. Alunos (Excel)".
                </div>
              )}

              {sortedSections.map((sec) => {
                const secQuestions = questions.filter((q) => q.sectionId === sec.id).sort((a, b) => a.order - b.order);
                if (secQuestions.length === 0) return null;
                return (
                  <div key={sec.id} className="p-5 rounded-2xl border border-stone-200 space-y-4">
                    <h3 className="text-xs sm:text-sm font-bold text-stone-900 uppercase font-serif border-b border-stone-100 pb-2">
                      {sec.title}
                    </h3>
                    {secQuestions.map((q, idx) => (
                      <div key={q.id}>

                Salvar Rascunho
              </button>
              <button
                type="submit"
                className="px-5 py-2 bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold rounded-xl cursor-pointer"
              >
                Enviar à Direção
              </button>
            </div>
          </form>

    // =========================================================================
    // 10. MODAL DE VISUALIZAÇÃO OFICIAL E IMPRESSÃO PDF
    // =========================================================================
    function ReportViewModal({ report, questions, sections, students, currentUser, onClose, onSignReport }) {
      const [isDownloadingPdf, setIsDownloadingPdf] = useState(false);
      const sortedSections = [...sections].sort((a, b) => a.order - b.order);
      const eventDisplay = normalizeEventLabel(report.trimester);

      const ratedIds = report.studentRatings ? Object.keys(report.studentRatings) : [];
      const currentClassStudents = students.filter((s) => sameClassGroup(s.classGroup, report.classGroup));

      const goodStudents = [];
      const badStudents = [];
      const transferredStudents = currentClassStudents.filter((s) => isStudentTransferred(s));

      if (ratedIds.length > 0) {
        ratedIds.forEach((stdId) => {
          const sr = report.studentRatings[stdId];
          if (!sr) return;
          const foundStd = students.find((s) => s.id === stdId);
          if (foundStd && isStudentTransferred(foundStd)) return;
          const studentObj = foundStd || { id: stdId, name: sr.studentName || 'Estudante', rollNumber: sr.rollNumber || '' };
          if (sr.rating === 'bom' || sr.rating === 'otimo') {
            goodStudents.push({ student: studentObj, ...sr });
          } else {
            badStudents.push({ student: studentObj, ...sr });
          }
        });
      }

      const formatConceptLabel = (rating) => {
        if (rating === 'otimo') return 'ÓTIMO';
        if (rating === 'bom') return 'BOM';
        if (rating === 'regular') return 'REGULAR';
        if (rating === 'ruim') return 'RUIM';
        return rating?.toUpperCase() || '';
      };

      const buildSafeFileName = () => {
        const clean = (str) =>
          String(str || '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-zA-Z0-9_-]+/g, '_')
            .replace(/^_+|_+$/g, '');
        return `Pre_Conselho_${clean(eventDisplay)}_${clean(report.classGroup)}_${clean(report.component)}_${clean(report.teacherName)}.pdf`;
      };

      const handlePrintReport = () => {
        const originalTitle = document.title;
        document.title = buildSafeFileName().replace('.pdf', '');
        window.print();
        setTimeout(() => {
          document.title = originalTitle;
        }, 500);
      };

      const handleDownloadPdf = async () => {
        const element = document.getElementById('printable-report-sheet');
        if (!element) return;

        if (!window.html2pdf) {
          handlePrintReport();
          return;
        }

        setIsDownloadingPdf(true);
        try {
          const opt = {
            margin: [10, 10, 12, 10],
            filename: buildSafeFileName(),
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: {
              scale: 2,
              useCORS: true,
              letterRendering: true,
              scrollY: 0,
            },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
          };
          await window.html2pdf().set(opt).from(element).save();
        } catch (err) {
          console.error('Erro ao gerar PDF:', err);
          handlePrintReport();
        } finally {
          setIsDownloadingPdf(false);
        }
      };

      return (
        <div id="report-modal-overlay" className="fixed inset-0 z-50 overflow-y-auto bg-stone-900/70 flex justify-center items-start p-4">
          <div id="report-modal-card" className="bg-white w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden my-4">
            <div className="no-print bg-stone-900 text-white px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-2">
              <span className="text-xs font-bold text-amber-400">
                Documento Oficial — {report.classGroup} ({report.component} • {eventDisplay})
              </span>
              <div className="flex flex-wrap items-center gap-2">
                {currentUser.role === 'diretora' && !report.diretoraSignature?.signed && (
                  <button
                    type="button"
                    onClick={() => onSignReport(report.id)}
                    className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg cursor-pointer"
                  >
                    Homologar Visto da Direção
                  </button>
                )}
                <button
                  type="button"
                  onClick={handlePrintReport}
                  className="flex items-center gap-1.5 px-3 py-1.5 bg-stone-700 hover:bg-stone-600 text-white text-xs font-semibold rounded-lg cursor-pointer"

                >

                <button
